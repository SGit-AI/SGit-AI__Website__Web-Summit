<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Demo screen · RiskMandate at Web Summit</title>
<meta name="description" content="One screen for our demos: pick a demo from the bar and it loads in the middle. Hide the bar for the full screen.">
<style>
  :root{--bg:#0b0d10;--bar:#14171c;--ink:#f3f4f6;--dim:#9aa3ad;--line:#262b33;--accent:#22c55e;--btn:#1c2128}
  @media (prefers-color-scheme: light){:root{--bg:#f5f5f2;--bar:#ffffff;--ink:#111418;--dim:#5b6470;--line:#e2e2dc;--btn:#f0f0ec;--accent:#15803d}}
  :root[data-theme=dark]{--bg:#0b0d10;--bar:#14171c;--ink:#f3f4f6;--dim:#9aa3ad;--line:#262b33;--accent:#22c55e;--btn:#1c2128}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.3 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
  body.side{flex-direction:row}
  #bar{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--bar);border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:thin}
  body.side #bar{flex-direction:column;align-items:stretch;width:230px;border-bottom:0;border-right:1px solid var(--line);overflow-y:auto;overflow-x:hidden}
  #brand{font-weight:700;white-space:nowrap;margin-right:6px;font-size:14px}
  #brand small{display:block;font-weight:400;color:var(--dim);font-size:11px}
  .demo{display:flex;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--btn);color:var(--ink);cursor:pointer;white-space:nowrap;font:inherit;text-align:left;min-height:44px}
  .demo kbd{font:600 11px ui-monospace,monospace;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
  .demo span small{display:none}
  body.side .demo span small{display:block;color:var(--dim);font-size:12px;white-space:normal;margin-top:2px}
  body.side .demo{white-space:normal}
  .demo[aria-current=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .demo:focus-visible,.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #tools{display:flex;gap:6px;margin-left:auto}
  body.side #tools{margin:auto 0 0;flex-wrap:wrap}
  .tool{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--dim);cursor:pointer;font:inherit;min-height:44px}
  #stage{position:relative;flex:1;min-height:0;min-width:0;background:#000}
  #stage iframe,#stage video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  #stage video{background:#000;object-fit:contain}
  #empty{position:absolute;inset:0;display:grid;place-items:center;color:#9aa3ad;text-align:center;padding:20px}
  #empty b{display:block;color:#f3f4f6;font-size:22px;margin-bottom:8px}
  #ext{position:absolute;right:10px;bottom:10px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;text-decoration:none;opacity:.5}
  #ext:hover{opacity:1}
  body.hidden #bar{display:none}
  #peek{display:none;position:fixed;top:8px;left:8px;z-index:9;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.55);color:#fff;font:inherit;cursor:pointer;opacity:.35;min-height:44px}
  #peek:hover,#peek:focus-visible{opacity:1}
  body.hidden #peek{display:block}
  @media (max-width:700px){body.side{flex-direction:column}body.side #bar{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}body.side .demo span small{display:none}#brand small{display:none}}
</style>
</head>
<body>
<nav id="bar" aria-label="Demos">
  <div id="brand">RiskMandate demos<small>Web Summit Lisbon 2026</small></div>
  <div id="list" style="display:contents"></div>
  <div id="tools">
    <button class="tool" id="layout" title="Bar on top or on the side (L)">Side</button>
    <button class="tool" id="full" title="Full screen (F)">Full screen</button>
    <button class="tool" id="hide" title="Hide this bar (H or Esc to bring it back)">Hide</button>
  </div>
</nav>
<button id="peek" title="Show the demo bar (H)">☰ Demos</button>
<main id="stage">
  <div id="empty"><div><b>Pick a demo</b>Click a button above, or press 1 to 9. H hides the bar, F goes full screen.</div></div>
</main>
<script>
(function(){
  var FALLBACK = /*__DEMOS__*/{"about": "The demo screen's links (/assets/demo/). Edit this file to change the buttons: order is the order shown; key is the keyboard shortcut. type 'page' opens the URL in the stage, 'video' plays it, 'new-tab' opens it outside (for sites that refuse to be framed).", "updated": "2026-11-11T18:45Z", "by": "conductor@web-summit.dinis", "demos": [{"key": "1", "title": "GAMMA-Ray", "sub": "How much an AI agent does on its own, and how well it is governed", "url": "https://gamma-ray.sgit.ai/spectrum/", "type": "page"}, {"key": "2", "title": "Gravity: the Universe", "sub": "Silvio's live map of the summit and our agents", "url": "https://web-summit.sgit.ai/people/silvio/app/#brain", "type": "page"}, {"key": "3", "title": "The team, live", "sub": "Angelo's animation: every dot an agent, every line a message", "url": "https://web-summit.sgit.ai/people/angelo/app/#live", "type": "page"}, {"key": "4", "title": "The X-ray", "sub": "Type a company and watch the agents X-ray it", "url": "https://web-summit.sgit.ai/xray/", "type": "page"}, {"key": "5", "title": "RiskMandate film", "sub": "Reach, mandate, gap in 53 seconds", "url": "https://riskmandate.ai/assets/media/film/riskmandate-reach-mandate-gap.mp4", "type": "video"}, {"key": "6", "title": "ABPs you can watch", "sub": "Agent Behaviour Policies in action", "url": "https://web-summit.sgit.ai/people/angelo/proposals/abp-live/player.htm", "type": "page"}, {"key": "7", "title": "Storm Charles", "sub": "The incident site our agents built in a day", "url": "https://storm-charles.promptugal.news/", "type": "page"}, {"key": "8", "title": "Lisbon Tech Fringe", "sub": "Everything happening around the summit", "url": "https://lisbontechfringe.com/", "type": "page"}, {"key": "9", "title": "PrompTugal.news", "sub": "The newsroom about agents", "url": "https://promptugal.news/", "type": "page"}]};
  var body=document.body, list=document.getElementById('list'), stage=document.getElementById('stage');
  var demos=[], current=null;
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
  function draw(){
    list.innerHTML='';
    demos.forEach(function(d,i){
      var b=document.createElement('button'); b.className='demo'; b.type='button';
      var k=document.createElement('kbd'); k.textContent=d.key||String(i+1);
      var s=document.createElement('span'); s.textContent=d.title; var sm=document.createElement('small'); sm.textContent=d.sub||''; s.appendChild(sm);
      b.appendChild(k); b.appendChild(s); b.title=(d.sub||d.title);
      b.onclick=function(){open(i)}; list.appendChild(b);
    });
  }
  function open(i){
    var d=demos[i]; if(!d) return;
    if(d.type==='new-tab'){window.open(d.url,'_blank','noopener');return}
    current=i; stage.innerHTML='';
    var el;
    if(d.type==='video'){el=document.createElement('video');el.src=d.url;el.controls=true;el.autoplay=true;el.playsInline=true}
    else{el=document.createElement('iframe');el.src=d.url;el.title=d.title;el.allow='fullscreen; autoplay; clipboard-write';el.referrerPolicy='no-referrer'}
    stage.appendChild(el);
    var a=document.createElement('a');a.id='ext';a.href=d.url;a.target='_blank';a.rel='noopener';a.textContent='Open in a new tab ↗';stage.appendChild(a);
    [].forEach.call(list.children,function(b,j){b.setAttribute('aria-current',j===i?'true':'false')});
    history.replaceState(null,'','#'+(d.key||i+1)); store('demo.last',String(i));
  }
  function setLayout(side){body.classList.toggle('side',side);document.getElementById('layout').textContent=side?'Top':'Side';store('demo.side',side?'1':'0')}
  function toggleHide(){body.classList.toggle('hidden')}
  function full(){var e=document.documentElement;if(!document.fullscreenElement){(e.requestFullscreen||e.webkitRequestFullscreen||function(){}).call(e)}else{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}}
  document.getElementById('layout').onclick=function(){setLayout(!body.classList.contains('side'))};
  document.getElementById('hide').onclick=toggleHide; document.getElementById('peek').onclick=toggleHide;
  document.getElementById('full').onclick=full;
  addEventListener('keydown',function(e){
    if(e.target&&/input|textarea/i.test(e.target.tagName))return;
    if(e.key==='h'||e.key==='H'){toggleHide();return}
    if(e.key==='Escape'&&body.classList.contains('hidden')){toggleHide();return}
    if(e.key==='f'||e.key==='F'){full();return}
    if(e.key==='l'||e.key==='L'){setLayout(!body.classList.contains('side'));return}
    var i=demos.findIndex(function(d,j){return (d.key||String(j+1))===e.key}); if(i>=0)open(i);
  });
  function start(data){
    demos=(data&&data.demos)||[]; draw(); setLayout(store('demo.side')==='1');
    var h=location.hash.slice(1), i=demos.findIndex(function(d,j){return (d.key||String(j+1))===h});
    if(i<0&&store('demo.last')!==null)i=+store('demo.last');
    if(i>=0&&demos[i])open(i);
  }
  fetch('demos.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():Promise.reject()}).then(start).catch(function(){start(FALLBACK)});
})();
</script>
</body>
</html>
