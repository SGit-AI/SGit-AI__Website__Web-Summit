<text x="1407.0" y="686" font-size="12" fill="#5e5d59" text-anchor="middle">18:52</text>
<rect x="1498" y="212" width="138" height="68" rx="8" fill="#ffffff" stroke="#1f5f8b" stroke-width="1.6"/>
