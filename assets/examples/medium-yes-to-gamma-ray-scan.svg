<text x="1087.0" y="686" font-size="12" fill="#5e5d59" text-anchor="middle">18:50 (about)</text>
<rect x="1178" y="212" width="138" height="68" rx="8" fill="#ffffff" stroke="#1f5f8b" stroke-width="1.6"/>
<text x="1188" y="234" font-size="12.5" fill="#141413">fixes applied;</text>
