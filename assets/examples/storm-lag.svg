<text x="30" y="530" font-size="12.5" fill="#141413"><tspan font-weight="700">Blue:</tspan> published by the source. <tspan font-weight="700">Open orange:</tspan> first read by our team. Times UTC (= Lisbon), 9 to 10 November 2026; press items labelled.</text>
<text x="30" y="550" font-size="12" fill="#5e5d59">The longest gaps came before the incident was declared. The last miss: Web Summit's own update sat in a section of its site we were not watching.</text>
