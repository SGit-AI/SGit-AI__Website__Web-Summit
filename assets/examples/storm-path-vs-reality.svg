<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<rect width="1400" height="520" fill="#faf9f5"/>
<text x="30" y="44" font-size="26" font-weight="700" fill="#141413">The parser path: what Dinis described, and what the agents did</text>
<text x="30" y="74" font-size="15" fill="#5e5d59">Five hands in the plan; one agent, the weather desk, did four of them itself, then asked for a developer and a designer</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#5e5d59"/></marker></defs>
<rect x="20" y="110" width="1360" height="160" rx="10" fill="#8a3b1f" fill-opacity="0.08"/>
<text x="34" y="182" font-size="16" font-weight="700" fill="#141413">the plan</text><text x="34" y="204" font-size="12.5" fill="#5e5d59">Dinis, about 17:00</text>
<rect x="200" y="126" width="218" height="128" rx="9" fill="#ffffff" stroke="#8a3b1f" stroke-width="1.8"/>
<text x="212" y="152" font-size="14" font-weight="700" fill="#141413">1. a raw source</text>
<text x="212" y="178" font-size="13" fill="#141413">an agent hits raw JSON</text>
<text x="212" y="197" font-size="13" fill="#141413">or a page where one</text>
<text x="212" y="216" font-size="13" fill="#141413">small part matters</text>
<path d="M420,190 H434" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="436" y="126" width="218" height="128" rx="9" fill="#ffffff" stroke="#8a3b1f" stroke-width="1.8"/>
<text x="448" y="152" font-size="14" font-weight="700" fill="#141413">2. a request</text>
<text x="448" y="178" font-size="13" fill="#141413">it asks the conductor:</text>
<text x="448" y="197" font-size="13" fill="#141413">&quot;can somebody build</text>
<text x="448" y="216" font-size="13" fill="#141413">a parser?&quot;</text>
<path d="M656,190 H670" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="672" y="126" width="218" height="128" rx="9" fill="#ffffff" stroke="#8a3b1f" stroke-width="1.8"/>
<text x="684" y="152" font-size="14" font-weight="700" fill="#141413">3. the architect</text>
<text x="684" y="178" font-size="13" fill="#141413">an architect writes</text>
<text x="684" y="197" font-size="13" fill="#141413">the plan as a</text>
<text x="684" y="216" font-size="13" fill="#141413">markdown file</text>
<path d="M892,190 H906" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="908" y="126" width="218" height="128" rx="9" fill="#ffffff" stroke="#8a3b1f" stroke-width="1.8"/>
<text x="920" y="152" font-size="14" font-weight="700" fill="#141413">4. developer, designer</text>
<text x="920" y="178" font-size="13" fill="#141413">a developer builds it,</text>
<text x="920" y="197" font-size="13" fill="#141413">a designer maps it</text>
<path d="M1128,190 H1142" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="1144" y="126" width="218" height="128" rx="9" fill="#ffffff" stroke="#8a3b1f" stroke-width="1.8"/>
<text x="1156" y="152" font-size="14" font-weight="700" fill="#141413">5. a UI</text>
<text x="1156" y="178" font-size="13" fill="#141413">checked; a UI turns</text>
<text x="1156" y="197" font-size="13" fill="#141413">noise into signal</text>
<rect x="20" y="290" width="1360" height="160" rx="10" fill="#1f5f8b" fill-opacity="0.08"/>
<text x="34" y="362" font-size="16" font-weight="700" fill="#141413">the record</text><text x="34" y="384" font-size="12.5" fill="#5e5d59">the commits, to 18:14</text>
<rect x="200" y="306" width="218" height="128" rx="9" fill="#ffffff" stroke="#1f5f8b" stroke-width="1.8"/>
<text x="212" y="332" font-size="14" font-weight="700" fill="#141413">1. a raw source</text>
<text x="212" y="358" font-size="13" fill="#141413">IPMA&#x27;s JSON read at 14:23;</text>
<text x="212" y="377" font-size="13" fill="#141413">then 8 sources mapped:</text>
<text x="212" y="396" font-size="13" fill="#141413">which a machine can read</text>
<path d="M420,370 H434" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="436" y="306" width="218" height="128" rx="9" fill="#ffffff" stroke="#8a8984" stroke-width="1.8" stroke-dasharray="4 4"/>
<text x="448" y="332" font-size="14" font-weight="700" fill="#141413">2. a request</text>
<text x="448" y="358" font-size="13" fill="#141413">skipped: the desk</text>
<text x="448" y="377" font-size="13" fill="#141413">built its readers itself</text>
<text x="448" y="396" font-size="13" fill="#141413">(17:51, watch.mjs)</text>
<path d="M656,370 H670" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)" stroke-dasharray="4 4"/>
<rect x="672" y="306" width="218" height="128" rx="9" fill="#ffffff" stroke="#1f5f8b" stroke-width="1.8"/>
<text x="684" y="332" font-size="14" font-weight="700" fill="#141413">3. the architect</text>
<text x="684" y="358" font-size="13" fill="#141413">the desk wrote it:</text>
<text x="684" y="377" font-size="13" fill="#141413">one storm page,</text>
<text x="684" y="396" font-size="13" fill="#141413">a proposal (17:52)</text>
<path d="M892,370 H906" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="908" y="306" width="218" height="128" rx="9" fill="#ffffff" stroke="#1f5f8b" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="920" y="332" font-size="14" font-weight="700" fill="#141413">4. developer, designer</text>
<text x="920" y="358" font-size="13" fill="#141413">readers: the desk (17:51);</text>
<text x="920" y="377" font-size="13" fill="#141413">the page: asked of dev.graphs@</text>
<text x="920" y="396" font-size="13" fill="#141413">and designer@ (18:13)</text>
<path d="M1128,370 H1142" stroke="#5e5d59" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="1144" y="306" width="218" height="128" rx="9" fill="#ffffff" stroke="#c96442" stroke-width="1.8" stroke-dasharray="4 4"/>
<text x="1156" y="332" font-size="14" font-weight="700" fill="#141413">5. a UI</text>
<text x="1156" y="358" font-size="13" fill="#141413">not yet</text>
<text x="30" y="486" font-size="12" fill="#5e5d59">Solid: done. Dashed blue: partly done. Grey dashed: skipped. Orange dashed: not yet. Times UTC, 10 November 2026.</text>
<text x="30" y="506" font-size="12" fill="#5e5d59">Drawn by journalist.examples@web-summit.dinis from reporter@web-summit.dinis's trace storm-weather-desk (parser_workflow) and PrompTugal__News__Website's commits 78d3a0cd, cc99e9b2, d826acce.</text>
</svg>
