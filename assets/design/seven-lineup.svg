<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 490" width="2800" height="490"><title>The seven together, a colour and a line each</title><rect width="2800" height="490" fill="#f4f4f2"/><g transform="translate(0,0)"><path d="M120,30 L165,10 Q200,40 235,10 L280,30 L380,90 L345,150 L305,128 L305,470 L95,470 L95,128 L55,150 L20,90 Z" fill="#111111" stroke="#0002"/><text x="200" y="175.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">DO YOU KNOW</text><text x="200" y="196.3" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">WHAT YOUR AGENTS</text><text x="200" y="217.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">ARE DOING?</text><text x="200" y="455.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">DINIS</text></g><g transform="translate(400,0)"><path d="M120,30 L165,10 Q200,40 235,10 L280,30 L380,90 L345,150 L305,128 L305,470 L95,470 L95,128 L55,150 L20,90 Z" fill="#1f3a93" stroke="#0002"/><text x="200" y="175.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">MY AGENTS</text><text x="200" y="198.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">HAVE A POLICY.</text><text x="200" y="236.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Do yours?</text><text x="200" y="455.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">NIMAY</text></g><g transform="translate(800,0)"><path d="M120,30 L165,10 Q200,40 235,10 L280,30 L380,90 L345,150 L305,128 L305,470 L95,470 L95,128 L55,150 L20,90 Z" fill="#1e7b4f" stroke="#0002"/><text x="200" y="175.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">ASK ME HOW</text><text x="200" y="208.6" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">I CONTROL</text><text x="200" y="242.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" text-anchor="middle">MY AGENTS</text><text x="200" y="455.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">ANGELO</text></g><g transform="translate(1200,0)"><path d="M120,30 L165,10 Q200,40 235,10 L280,30 L380,90 L345,150 L305,128 L305,470 L95,470 L95,128 L55,150 L20,90 Z" fill="#e86a1c" stroke="#0002"/><text x="200" y="175.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle">I BROUGHT</text><text x="200" y="205.2" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle">6 AGENTS TO</text><text x="200" y="235.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="800" fill="#ffffff" text-anchor="middle">WEB SUMMIT.</text><text x="200" y="279.7" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Ask me what they&#x27;re doing.</text><text x="200" y="455.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">JOSE</text></g><g transform="translate(1600,0)"><path d="M120,30 L165,10 Q200,40 235,10 L280,30 L380,90 L345,150 L305,128 L305,470 L95,470 L95,128 L55,150 L20,90 Z" fill="#6b3fa0" stroke="#0002"/><text x="200" y="175.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">WHO&#x27;S ON THE</text><text x="200" y="200.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">OTHER SIDE OF</text><text x="200" y="226.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle">YOUR AGENT?</text><text x="200" y="455.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">VICKY</text></g><g transform="translate(2000,0)"><path d="M120,30 L165,10 Q200,40 235,10 L280,30 L380,90 L345,150 L305,128 L305,470 L95,470 L95,128 L55,150 L20,90 Z" fill="#c62828" stroke="#0002"/><text x="200" y="175.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="middle">YOUR AI</text><text x="200" y="203.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="middle">HAS ACCESS.</text><text x="200" y="231.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="middle">DOES IT HAVE</text><text x="200" y="259.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#ffffff" text-anchor="middle">PERMISSION?</text><text x="200" y="455.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">SILVIO</text></g><g transform="translate(2400,0)"><path d="M120,30 L165,10 Q200,40 235,10 L280,30 L380,90 L345,150 L305,128 L305,470 L95,470 L95,128 L55,150 L20,90 Z" fill="#f2b705" stroke="#0002"/><text x="200" y="175.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#111111" text-anchor="middle">KNOW THEIR</text><text x="200" y="203.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#111111" text-anchor="middle">REACH.</text><text x="200" y="231.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#111111" text-anchor="middle">DEFINE THEIR</text><text x="200" y="259.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#111111" text-anchor="middle">MANDATE.</text><text x="200" y="287.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#111111" text-anchor="middle">CONTROL</text><text x="200" y="315.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="800" fill="#111111" text-anchor="middle">THE GAP.</text><text x="200" y="455.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#111111" text-anchor="middle">INDI</text></g></svg>
