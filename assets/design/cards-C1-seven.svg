<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1040" width="760" height="1040"><title>C1: a card for each of the seven</title><rect width="760" height="1040" fill="#f4f4f2"/><g transform="translate(0,0)"><rect x="20" y="20" width="340" height="220" rx="8" fill="#fff" stroke="#0003"/><rect x="20" y="20" width="26" height="220" rx="4" fill="#111111"/><text x="66" y="92.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#111" text-anchor="start">Dinis Cruz</text><text x="66" y="116.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#444" text-anchor="start">RiskMandate</text><text x="66" y="160.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#111" text-anchor="start">“Ask me what my agents did today.”</text><text x="66" y="215.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#111111" text-anchor="start">RISKMANDATE · WEB SUMMIT 2026</text></g><g transform="translate(380,0)"><rect x="20" y="20" width="340" height="220" rx="8" fill="#fff" stroke="#0003"/><rect x="20" y="20" width="26" height="220" rx="4" fill="#1f3a93"/><text x="66" y="92.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#111" text-anchor="start">Nimay Parekh</text><text x="66" y="116.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#444" text-anchor="start">RiskMandate</text><text x="66" y="160.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#111" text-anchor="start">“My agents have a policy. Do yours?”</text><text x="66" y="215.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#1f3a93" text-anchor="start">RISKMANDATE · WEB SUMMIT 2026</text></g><g transform="translate(0,260)"><rect x="20" y="20" width="340" height="220" rx="8" fill="#fff" stroke="#0003"/><rect x="20" y="20" width="26" height="220" rx="4" fill="#1e7b4f"/><text x="66" y="92.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#111" text-anchor="start">Angelo</text><text x="66" y="116.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#444" text-anchor="start">RiskMandate</text><text x="66" y="160.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#111" text-anchor="start">“Ask me how I control my agents.”</text><text x="66" y="215.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#1e7b4f" text-anchor="start">RISKMANDATE · WEB SUMMIT 2026</text></g><g transform="translate(380,260)"><rect x="20" y="20" width="340" height="220" rx="8" fill="#fff" stroke="#0003"/><rect x="20" y="20" width="26" height="220" rx="4" fill="#e86a1c"/><text x="66" y="92.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#111" text-anchor="start">Jose Bota</text><text x="66" y="116.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#444" text-anchor="start">RiskMandate</text><text x="66" y="160.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#111" text-anchor="start">“I brought 6 agents. Ask me why.”</text><text x="66" y="215.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#e86a1c" text-anchor="start">RISKMANDATE · WEB SUMMIT 2026</text></g><g transform="translate(0,520)"><rect x="20" y="20" width="340" height="220" rx="8" fill="#fff" stroke="#0003"/><rect x="20" y="20" width="26" height="220" rx="4" fill="#6b3fa0"/><text x="66" y="92.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#111" text-anchor="start">Vicky</text><text x="66" y="116.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#444" text-anchor="start">RiskMandate</text><text x="66" y="160.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#111" text-anchor="start">“Who&#x27;s on the other side of your agent?”</text><text x="66" y="215.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#6b3fa0" text-anchor="start">RISKMANDATE · WEB SUMMIT 2026</text></g><g transform="translate(380,520)"><rect x="20" y="20" width="340" height="220" rx="8" fill="#fff" stroke="#0003"/><rect x="20" y="20" width="26" height="220" rx="4" fill="#c62828"/><text x="66" y="92.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#111" text-anchor="start">Silvio Switha</text><text x="66" y="116.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#444" text-anchor="start">RiskMandate</text><text x="66" y="160.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#111" text-anchor="start">“Agents with a mandate.”</text><text x="66" y="215.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#c62828" text-anchor="start">RISKMANDATE · WEB SUMMIT 2026</text></g><g transform="translate(0,780)"><rect x="20" y="20" width="340" height="220" rx="8" fill="#fff" stroke="#0003"/><rect x="20" y="20" width="26" height="220" rx="4" fill="#f2b705"/><text x="66" y="92.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#111" text-anchor="start">Indi Gupte</text><text x="66" y="116.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#444" text-anchor="start">RiskMandate</text><text x="66" y="160.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#111" text-anchor="start">“Your agents. Your rules.”</text><text x="66" y="215.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#111" text-anchor="start">RISKMANDATE · WEB SUMMIT 2026</text></g></svg>
