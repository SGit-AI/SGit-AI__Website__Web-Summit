<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#faf9f5"/>
  <text x="600" y="56" text-anchor="middle" font-size="32" font-weight="700" fill="#141413">Help us cover the summit: the rules of the game</text>
  <text x="600" y="90" text-anchor="middle" font-size="17" fill="#5e5d59">PrompTugal.news and RiskMandate · Web Summit Lisbon, 9 to 12 November 2026</text>
  <!-- rules -->
  <g font-size="17">
    <rect x="60" y="118" width="340" height="110" rx="16" fill="#e3ecd9"/>
    <text x="230" y="158" text-anchor="middle" font-size="22" font-weight="700" fill="#3f5a2a">Open source</text>
    <text x="230" y="190" text-anchor="middle" fill="#3d3d3a">Everything you make is open</text>
    <text x="230" y="212" text-anchor="middle" fill="#3d3d3a">source, and it stays yours</text>
    <rect x="430" y="118" width="340" height="110" rx="16" fill="#dce8f2"/>
    <text x="600" y="158" text-anchor="middle" font-size="22" font-weight="700" fill="#1f5f8b">We review, we publish</text>
    <text x="600" y="190" text-anchor="middle" fill="#3d3d3a">If it is good, it goes on the</text>
    <text x="600" y="212" text-anchor="middle" fill="#3d3d3a">site with your name on it</text>
    <rect x="800" y="118" width="340" height="110" rx="16" fill="#f3dfd6"/>
    <text x="970" y="158" text-anchor="middle" font-size="22" font-weight="700" fill="#8a3b1f">No payment, for now</text>
    <text x="970" y="190" text-anchor="middle" fill="#3d3d3a">You do it because it is fun,</text>
    <text x="970" y="212" text-anchor="middle" fill="#3d3d3a">and you get seen for it</text>
  </g>
  <!-- pipeline -->
  <text x="600" y="282" text-anchor="middle" font-size="20" font-weight="700" fill="#141413">How it works, in seven steps</text>
  <g font-size="15" text-anchor="middle">
    <g fill="#ffffff" stroke="#c9c6bb" stroke-width="2">
      <rect x="40" y="306" width="140" height="150" rx="14"/><rect x="200" y="306" width="140" height="150" rx="14"/>
      <rect x="360" y="306" width="140" height="150" rx="14"/><rect x="520" y="306" width="140" height="150" rx="14"/>
      <rect x="680" y="306" width="140" height="150" rx="14"/><rect x="840" y="306" width="140" height="150" rx="14"/>
      <rect x="1000" y="306" width="160" height="150" rx="14"/>
    </g>
    <g font-size="30" font-weight="700" fill="#c96442">
      <text x="110" y="350">1</text><text x="270" y="350">2</text><text x="430" y="350">3</text><text x="590" y="350">4</text><text x="750" y="350">5</text><text x="910" y="350">6</text><text x="1080" y="350">7</text>
    </g>
    <g font-weight="700" fill="#141413" font-size="17">
      <text x="110" y="384">We meet</text><text x="270" y="384">Pick a task</text><text x="430" y="384">Make it</text><text x="590" y="384">Send it</text><text x="750" y="384">We review</text><text x="910" y="384">Published</text><text x="1080" y="384">Share it</text>
    </g>
    <g fill="#5e5d59">
      <text x="110" y="410">at the summit,</text><text x="110" y="430">or online</text>
      <text x="270" y="410">an hour or</text><text x="270" y="430">less each</text>
      <text x="430" y="410">an article, a</text><text x="430" y="430">photo, a review</text>
      <text x="590" y="410">from your phone,</text><text x="590" y="430">no account</text>
      <text x="750" y="410">fast, with</text><text x="750" y="430">notes back</text>
      <text x="910" y="410">with your name</text><text x="910" y="430">and your link</text>
      <text x="1080" y="410">on X, LinkedIn,</text><text x="1080" y="430">and the wall</text>
    </g>
  </g>
  
  <!-- tasks -->
  <text x="600" y="508" text-anchor="middle" font-size="20" font-weight="700" fill="#141413">Where to start: pick one</text>
  <g font-size="16" fill="#3d3d3a">
    <rect x="60" y="528" width="530" height="150" rx="16" fill="#ffffff" stroke="#1f5f8b" stroke-width="2"/>
    <text x="84" y="560" font-weight="700" fill="#1f5f8b" font-size="18">For PrompTugal.news: write</text>
    <text x="84" y="590">• what you saw today  • a session you attended</text>
    <text x="84" y="616">• a company you met  • what you learnt</text>
    <text x="84" y="642">• about you  • a photo with a caption  • a review</text>
    <text x="84" y="668">Rough is fine: we help it grow into an article.</text>
    <rect x="610" y="528" width="530" height="150" rx="16" fill="#ffffff" stroke="#3f5a2a" stroke-width="2"/>
    <text x="634" y="560" font-weight="700" fill="#3f5a2a" font-size="18">For RiskMandate: try and tell us</text>
    <text x="634" y="590">• try the demo, say what confused you</text>
    <text x="634" y="616">• map one of your agent workflows</text>
    <text x="634" y="642">• an AI agent risk you have seen  • review an ABP</text>
    <text x="634" y="668">Learn it, talk about it, maybe consult on it.</text>
  </g>
  <text x="600" y="706" text-anchor="middle" font-size="14" fill="#5e5d59">Every contributor appears on the contributors' wall · web-summit.sgit.ai/contributors/</text>
</svg>
