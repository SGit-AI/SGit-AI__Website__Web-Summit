<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#faf9f5"/>
  <text x="600" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#141413">Three apps, three lines</text>
  <text x="600" y="92" text-anchor="middle" font-size="17" fill="#5e5d59">Where each thing goes is decided by one question: is it public, or private?</text>
  <!-- the public / private band -->
  <rect x="40" y="118" width="740" height="34" rx="8" fill="#e3ecd9"/>
  <text x="410" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#3f5a2a">PUBLIC: nothing secret, safe to hand to anyone</text>
  <rect x="800" y="118" width="360" height="34" rx="8" fill="#f3dfd6"/>
  <text x="980" y="141" text-anchor="middle" font-size="15" font-weight="700" fill="#8a3b1f">PRIVATE: keys, vaults, our data</text>
  <!-- cards -->
  <g>
    <rect x="40" y="170" width="360" height="520" rx="18" fill="#ffffff" stroke="#c9c6bb" stroke-width="2"/>
    <rect x="40" y="170" width="360" height="86" rx="18" fill="#1f5f8b"/><rect x="40" y="230" width="360" height="26" fill="#1f5f8b"/>
    <text x="220" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#cfe3f1" letter-spacing="2">THE EVENT APP</text>
    <text x="220" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">PT News: Lisbon event</text>
    <text x="64" y="294" font-size="16" font-weight="700" fill="#141413">On the App Store (submitted)</text>
    <text x="64" y="318" font-size="15" fill="#3d3d3a">For everyone at the summit</text>
    <text x="64" y="360" font-size="15" font-weight="700" fill="#141413">The rule</text>
    <text x="64" y="384" font-size="15" fill="#3d3d3a">Light, clean, privacy-first.</text>
    <text x="64" y="406" font-size="15" fill="#3d3d3a">Add every feature that keeps the</text>
    <text x="64" y="428" font-size="15" fill="#3d3d3a">same permissions, the same privacy</text>
    <text x="64" y="450" font-size="15" fill="#3d3d3a">answers and the same attack surface.</text>
    <text x="64" y="472" font-size="15" fill="#3d3d3a">No experiments until v1 is out.</text>
    <text x="64" y="514" font-size="15" font-weight="700" fill="#141413">Why</text>
    <text x="64" y="538" font-size="15" fill="#3d3d3a">Fast review, wide adoption.</text>
    <text x="64" y="580" font-size="15" font-weight="700" fill="#141413">Never</text>
    <text x="64" y="604" font-size="15" fill="#3d3d3a">Secrets, keys, private data,</text>
    <text x="64" y="626" font-size="15" fill="#3d3d3a">new permission requests.</text>
    <text x="220" y="672" text-anchor="middle" font-size="13" fill="#5e5d59">public · published · reviewed by Apple</text>
  </g>
  <g>
    <rect x="420" y="170" width="360" height="520" rx="18" fill="#ffffff" stroke="#c9c6bb" stroke-width="2"/>
    <rect x="420" y="170" width="360" height="86" rx="18" fill="#3f5a2a"/><rect x="420" y="230" width="360" height="26" fill="#3f5a2a"/>
    <text x="600" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#d9e6cc" letter-spacing="2">THE RISKMANDATE APP</text>
    <text x="600" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">RiskMandate</text>
    <text x="444" y="294" font-size="16" font-weight="700" fill="#141413">Not on the App Store, for now</text>
    <text x="444" y="318" font-size="15" fill="#3d3d3a">For customers, clients and testers</text>
    <text x="444" y="360" font-size="15" font-weight="700" fill="#141413">The rule</text>
    <text x="444" y="384" font-size="15" fill="#3d3d3a">Everything in it is public, aligned</text>
    <text x="444" y="406" font-size="15" fill="#3d3d3a">with the website, packaged to be</text>
    <text x="444" y="428" font-size="15" fill="#3d3d3a">easy to consume: the demos, the</text>
    <text x="444" y="450" font-size="15" fill="#3d3d3a">videos, the workflows, the materials.</text>
    <text x="444" y="472" font-size="15" fill="#3d3d3a">Experiments welcome (the vault...).</text>
    <text x="444" y="514" font-size="15" font-weight="700" fill="#141413">Why</text>
    <text x="444" y="538" font-size="15" fill="#3d3d3a">Hand it to anyone, nothing leaks.</text>
    <text x="444" y="580" font-size="15" font-weight="700" fill="#141413">Never</text>
    <text x="444" y="604" font-size="15" fill="#3d3d3a">Our tasks, private data, secrets</text>
    <text x="444" y="626" font-size="15" fill="#3d3d3a">(those live in the team app).</text>
    <text x="600" y="672" text-anchor="middle" font-size="13" fill="#5e5d59">public · not in a store yet (no waiting on review)</text>
  </g>
  <g>
    <rect x="800" y="170" width="360" height="520" rx="18" fill="#ffffff" stroke="#c9c6bb" stroke-width="2"/>
    <rect x="800" y="170" width="360" height="86" rx="18" fill="#8a3b1f"/><rect x="800" y="230" width="360" height="26" fill="#8a3b1f"/>
    <text x="980" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#f3dfd6" letter-spacing="2">THE TEAM APP</text>
    <text x="980" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">PT News Team</text>
    <text x="824" y="294" font-size="16" font-weight="700" fill="#141413">Never in a store; we ship it ourselves</text>
    <text x="824" y="318" font-size="15" fill="#3d3d3a">For the team only</text>
    <text x="824" y="360" font-size="15" font-weight="700" fill="#141413">The rule</text>
    <text x="824" y="384" font-size="15" fill="#3d3d3a">The only app with private data:</text>
    <text x="824" y="406" font-size="15" fill="#3d3d3a">vaults, keys, secrets. All our work</text>
    <text x="824" y="428" font-size="15" fill="#3d3d3a">in one place: tasks, projects, flows,</text>
    <text x="824" y="450" font-size="15" fill="#3d3d3a">calendars, where is everybody, what</text>
    <text x="824" y="472" font-size="15" fill="#3d3d3a">the agents do; feeds from elsewhere.</text>
    <text x="824" y="514" font-size="15" font-weight="700" fill="#141413">Why</text>
    <text x="824" y="538" font-size="15" fill="#3d3d3a">Our orchestration and the place</text>
    <text x="824" y="560" font-size="15" fill="#3d3d3a">for the most experimental features.</text>
    <text x="824" y="602" font-size="15" font-weight="700" fill="#141413">Where tasks go</text>
    <text x="824" y="626" font-size="15" fill="#3d3d3a">Here, RiskMandate's tasks included.</text>
    <text x="980" y="672" text-anchor="middle" font-size="13" fill="#5e5d59">private · run by us · released as often as we like</text>
  </g>
  <text x="600" y="728" text-anchor="middle" font-size="15" fill="#3d3d3a">Not sure where something goes? Private → the team app. RiskMandate and public → the RiskMandate app. For everyone, and no new permission → the event app.</text>
</svg>
