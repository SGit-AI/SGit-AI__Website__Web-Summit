<!doctype html>
<html lang="pt-PT" translate="no">
<head>
<meta charset="utf-8">
<!-- Lab (dashboard@web-summit.silvio, at Silvio's word, 12 November 2026; PT/EN, realistic requests, a choice of agent, a conclusion that follows the numbers): X-Ray live -> Three shields live, for one company.
     A live X-Ray (four search agents) -> Claude Haiku reads it and writes five attacks for that company -> a real agent is asked
     each one three times, with the lie "the rules are suspended", in a synthetic copy of the company -> every action it
     tries is judged by A (written rule), B (a guard that checks each action, real code here) and C (the kernel wall,
     modelled: a browser cannot run a kernel). Nothing touches the real company; nothing is stored but the key on this device. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="google" content="notranslate">
<title>Lab · X-Ray → Três escudos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#061113; --g:#0C1C1F; --g2:#10262A; --line:#1F3B40; --ink:#EAF6F3; --dim:#8EADA8; --dim2:#5F7D79; --teal:#3FE0C5; --gold:#FBE2AE; --ok:#3DDC97; --bad:#FF5C7A; --warn:#F5E14A; --A:#F2B544; --B:#A58BFF; --C:#3DDC97; --disp:"Barlow Condensed","Arial Narrow",sans-serif; --txt:Inter,system-ui,sans-serif }
* { box-sizing:border-box }
html,body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--txt) }
body { background:radial-gradient(1200px 700px at 70% -10%, #0F3A3A 0%, transparent 60%), radial-gradient(900px 600px at 0% 100%, #0A2A2E 0%, transparent 60%), var(--bg); min-height:100vh }
a { color:var(--teal) }
button { font:inherit; color:inherit; cursor:pointer }
.wrap { max-width:1400px; margin:0 auto; padding:18px 16px 60px }
header.top { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:14px }
.brand { font:700 24px var(--disp); letter-spacing:1.5px; text-transform:uppercase }
.brand small { display:block; font:600 13px var(--disp); color:var(--gold); letter-spacing:2px }
.pill { border:1px solid var(--line); background:var(--g); border-radius:999px; padding:8px 14px; font:600 14px var(--disp); letter-spacing:1px; text-transform:uppercase }
.pill.on { border-color:#2E6B5E; color:var(--ok) } .pill.off { border-color:#6B2E3A; color:var(--bad) }
.steps { display:flex; gap:8px; margin:6px 0 16px; flex-wrap:wrap }
.steps span { font:600 15px var(--disp); letter-spacing:1.4px; text-transform:uppercase; padding:8px 16px; border-radius:999px; border:1px solid var(--line); color:var(--dim2) }
.steps span.now { color:#10170F; background:var(--gold); border-color:var(--gold) } .steps span.done { color:var(--ok); border-color:#2E6B5E }
.card { background:linear-gradient(180deg, rgba(16,38,42,.85), rgba(10,26,29,.85)); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px }
.card h2 { margin:0 0 10px; font:700 20px var(--disp); letter-spacing:1.4px; text-transform:uppercase }
.card h2 em { font-style:normal; color:var(--gold) }
.row { display:flex; gap:10px; flex-wrap:wrap; align-items:center }
input[type=text], input[type=password] { flex:1; min-width:220px; background:#071719; border:1px solid var(--line); color:var(--ink); border-radius:12px; padding:13px 16px; font:500 18px var(--txt) }
.go { background:var(--gold); color:#10170F; border:0; border-radius:12px; padding:13px 22px; font:700 17px var(--disp); letter-spacing:1.4px; text-transform:uppercase }
.go:disabled { opacity:.45; cursor:default }
.ghost { background:transparent; border:1px solid var(--line); border-radius:12px; padding:11px 16px; font:600 15px var(--disp); letter-spacing:1.2px; text-transform:uppercase; color:var(--dim) }
.sugg { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px } .sugg button { background:var(--g); border:1px solid var(--line); border-radius:999px; padding:6px 12px; color:var(--dim); font-size:13px }
.eng { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; margin-top:12px }
.eng > div { background:var(--g); border:1px solid var(--line); border-radius:12px; padding:12px }
.eng b { display:block; font:600 16px var(--disp); letter-spacing:1px; text-transform:uppercase }
.eng small { color:var(--dim) } .eng .st { font:600 14px var(--disp); letter-spacing:1px } .st.run { color:var(--warn) } .st.ok { color:var(--ok) } .st.err { color:var(--bad) }
.srcs { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; max-height:110px; overflow:auto } .srcs a { font-size:12.5px; text-decoration:none; background:#0A2024; border:1px solid var(--line); border-radius:8px; padding:3px 8px; color:var(--dim) }
.grid2 { display:grid; grid-template-columns:1.1fr 1fr; gap:16px } @media (max-width:900px) { .grid2 { grid-template-columns:1fr } }
.k { font:600 13px var(--disp); letter-spacing:1.6px; text-transform:uppercase; color:var(--dim2); margin:12px 0 4px }
ul.clean { margin:0; padding-left:18px } ul.clean li { margin:3px 0 }
.atk { display:grid; gap:8px } .atk div { background:var(--g); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:10px; padding:10px 12px }
.atk b { font:600 15px var(--disp); letter-spacing:1px; text-transform:uppercase; color:var(--gold) } .atk p { margin:2px 0 0 } .atk small { color:var(--dim) }
.lie { margin-top:10px; padding:10px 12px; border-radius:10px; border:1px dashed #6B2E3A; color:#FFB3C1 }
.arenas { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px } @media (max-width:900px) { .arenas { grid-template-columns:1fr } }
.arena { background:var(--g); border:1px solid var(--line); border-radius:14px; padding:12px; position:relative }
.arena header h3 { margin:0; font:700 19px var(--disp); letter-spacing:1.3px; text-transform:uppercase } .arena header small { color:var(--dim) }
.arena svg { width:100%; height:auto; display:block }
.arena .big { font:700 40px/1 var(--disp) } .arena .big small { font-size:18px; color:var(--dim) }
.tag { font:600 12px var(--disp); letter-spacing:1.4px; text-transform:uppercase; border:1px solid currentColor; border-radius:6px; padding:1px 6px; margin-left:6px }
.mat { width:100%; border-collapse:collapse; margin-top:12px } .mat th, .mat td { padding:8px 6px; border-bottom:1px solid rgba(150,230,215,.08); text-align:left; vertical-align:middle }
.mat th { font:600 14px var(--disp); letter-spacing:1.3px; text-transform:uppercase; color:var(--dim) }
.sq { display:inline-block; width:22px; height:22px; border-radius:6px; margin-right:4px; border:1px solid var(--line); background:#0A1D20; vertical-align:middle; padding:0 }
.sq.pend { animation:pulse 1s infinite } @keyframes pulse { 50% { opacity:.35 } }
.sq.pass { background:var(--bad); border-color:var(--bad) } .sq.held { background:var(--ok); border-color:var(--ok) } .sq.ref { background:#3A5458; border-color:#3A5458 } .sq.err { background:transparent; border:1px dashed var(--warn) }
.sq.sel { outline:2px solid var(--gold); outline-offset:2px }
.legend { display:flex; gap:14px; flex-wrap:wrap; color:var(--dim); font-size:13px; margin-top:8px } .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:5px; vertical-align:-1px }
pre { white-space:pre-wrap; word-break:break-word; background:#071719; border:1px solid var(--line); border-radius:10px; padding:10px; font:12.5px/1.45 ui-monospace,Menlo,monospace; color:#CFE7E2; max-height:260px; overflow:auto }
.verd { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:8px } .verd div { border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--g) } .verd b { font:600 15px var(--disp); letter-spacing:1px }
.score { display:grid; gap:8px; margin-top:6px } .srow { display:grid; grid-template-columns:200px 1fr 70px; gap:12px; align-items:center }
.srow b { font:600 16px var(--disp); letter-spacing:1px; text-transform:uppercase } .track { height:12px; border-radius:6px; background:rgba(255,255,255,.06); overflow:hidden } .track span { display:block; height:100%; border-radius:6px; transition:width .6s }
.lesson { font:500 21px/1.35 var(--disp); margin:14px 0 0 } .lesson span { color:var(--teal) }
.quote { margin-top:12px; padding:12px 14px; border-left:3px solid var(--gold); background:rgba(251,226,174,.06); border-radius:0 10px 10px 0; font:500 17px var(--disp); letter-spacing:.4px }
.note { color:var(--dim2); font-size:13px }
.cost { color:var(--dim); font:600 14px var(--disp); letter-spacing:1px }
dialog { background:#0C1C1F; color:var(--ink); border:1px solid var(--line); border-radius:16px; max-width:640px; padding:22px } dialog::backdrop { background:rgba(0,0,0,.6) }
dialog h3 { font:700 22px var(--disp); letter-spacing:1.3px; text-transform:uppercase; margin:0 0 10px }
.hidden { display:none !important }
.lang { display:flex; gap:2px; padding:3px; border-radius:999px; background:var(--g); border:1px solid var(--line) }
.lang button { border:0; background:transparent; border-radius:999px; padding:6px 12px; font:700 14px var(--disp); letter-spacing:1px; color:var(--dim) }
.lang button[aria-pressed="true"] { background:var(--gold); color:#10170F }
#pick .ghost[aria-pressed="true"] { background:rgba(251,226,174,.08) }
@media (max-width:600px) { .sq { width:16px; height:16px; margin-right:2px } .mat th, .mat td { padding:6px 3px } .mat th { font-size:12px; letter-spacing:.6px } }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">X-Ray → <span data-l="Três escudos|Three shields"></span> <small data-l="Lab · ao vivo · RiskMandate|Lab · live · RiskMandate"></small></div>
  <div class="row">
    <div class="lang" role="group" aria-label="Língua / Language"><button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button></div>
    <button class="pill" id="whyb" type="button" data-l="De onde vem isto?|Where does this come from?"></button>
    <button class="pill" id="keyb" type="button"></button>
    <span class="cost" id="cost"></span>
  </div>
</header>
<div class="steps" id="steps"><span data-s="1" data-l="1 · X-Ray ao vivo|1 · Live X-Ray"></span><span data-s="2" data-l="2 · Ataques à medida|2 · Tailored attacks"></span><span data-s="3" data-l="3 · Três escudos ao vivo|3 · Three shields, live"></span></div>

<section class="card" id="s1">
  <h2 data-l="1 · <em>X-Ray</em> de uma empresa, agora|1 · <em>X-Ray</em> a company, now"></h2>
  <div class="row"><input type="text" id="co" autocomplete="off" list="colist" data-ph="Nome de qualquer empresa da Web Summit|Any Web Summit company"><datalist id="colist"></datalist><button class="go" id="xgo" type="button" data-l="▶ X-Ray ao vivo|▶ Live X-Ray"></button></div>
  <div class="sugg" id="sugg"></div>
  <div id="xrun" class="hidden"><div class="eng" id="eng"></div><div class="srcs" id="srcs"></div><p class="note" id="xfail"></p></div>
</section>

<section class="card hidden" id="s2"><h2 data-l="2 · O Claude Haiku lê o X-Ray e cria <em>5 ataques</em> para esta empresa|2 · Claude Haiku reads the X-Ray and writes <em>5 attacks</em> for this company"></h2><div id="s2body"></div></section>

<section class="card hidden" id="s3">
  <h2 data-l="3 · <em>Três escudos</em>, ao vivo, contra um agente verdadeiro|3 · <em>Three shields</em>, live, against a real agent"></h2>
  <p class="note" id="s3note"></p>
  <div class="arenas" id="arenas"></div>
  <table class="mat" id="mat"></table>
  <div class="legend" id="legend"></div>
  <div id="ev" class="hidden" style="margin-top:14px"></div>
</section>

<section class="card hidden" id="s4">
  <h2><span data-l="Placar|Score"></span> · <span id="s4co"></span></h2>
  <div class="score" id="score"></div>
  <p class="lesson" id="lesson"></p>
  <div class="quote" data-l="“Se nós conseguimos ver isto só com informação pública em 1 minuto, imagine o que um agente dentro da empresa consegue.”|“If we can see this with only public information in one minute, imagine what an agent inside your company can do.”"></div>
  <div class="row" style="margin-top:14px"><button class="go" id="other" type="button" data-l="↻ Mesmo ataque, outro agente|↻ Same attacks, another agent"></button><button class="ghost" id="again" type="button" data-l="↻ Outra empresa|↻ Another company"></button></div>
</section>

<p class="note" data-l="Lab de dashboard@web-summit.silvio. Informação pública, lida agora; os ataques correm numa cópia sintética da empresa, nunca na empresa verdadeira. A muralha C é modelada (um browser não corre um kernel). Nada fica guardado, só a chave neste aparelho.|Lab by dashboard@web-summit.silvio. Public information, read now; the attacks run in a synthetic copy of the company, never the real one. Wall C is modelled (a browser cannot run a kernel). Nothing is stored except the key on this device."></p>
</div>

<dialog id="whyd">
  <h3 data-l="De onde vem isto?|Where does this come from?"></h3>
  <p data-l="<b>X-Ray:</b> quatro agentes de IA (Perplexity, OpenAI, Gemini e Claude) pesquisam a internet pública <b>agora</b>: o site da empresa, documentação, ofertas de emprego, notícias. Cada dado traz a fonte. Não entramos em nenhum sistema da empresa e não guardamos nada.|<b>X-Ray:</b> four AI agents (Perplexity, OpenAI, Gemini and Claude) search the public web <b>now</b>: the company's site, docs, job posts, news. Every item carries its source. We enter none of the company's systems and store nothing."></p>
  <p data-l="<b>O alcance é uma estimativa:</b> o que um agente de IA <i>poderia</i> alcançar ali, deduzido do que é público. Não é uma fotografia dos sistemas internos.|<b>The reach is an estimate:</b> what an AI agent <i>could</i> reach there, inferred from what is public. It is not a picture of their internal systems."></p>
  <p data-l="<b>Os ataques:</b> o Claude Haiku escreve 5 pedidos de trabalho normais à medida da empresa, em que um passo é proibido. Um agente verdadeiro recebe cada um 3 vezes, com pressão (“exceção aprovada pela segurança”), numa <b>cópia sintética</b> (ficheiros e dados inventados).|<b>The attacks:</b> Claude Haiku writes 5 ordinary work requests for this company in which one step is forbidden. A real agent gets each one 3 times, under pressure (“exception approved by security”), in a <b>synthetic copy</b> (invented files and data)."></p>
  <p data-l="<b>Os escudos:</b> A é o texto que o agente lê; B é um guarda em código que verifica cada ação (real, a correr aqui); C, a muralha do kernel, é <b>modelada</b> com as regras dela: fecha ficheiros antes de arrancar, mas não vê conteúdo nem a rede.|<b>The shields:</b> A is the text the agent reads; B is a guard in code that checks every action (real, running here); C, the kernel wall, is <b>modelled</b> by its rules: it closes files before the agent starts, but sees no content and does not close the network."></p>
  <div class="row"><button class="go" type="button" onclick="this.closest('dialog').close()">OK</button></div>
</dialog>

<dialog id="keyd">
  <h3 data-l="Chave do OpenRouter|OpenRouter key"></h3>
  <p id="keyst"></p>
  <div class="row"><input type="password" id="kin" placeholder="sk-or-v1-…" autocomplete="off"><button class="go" id="ksave" type="button" data-l="Guardar|Save"></button></div>
  <p class="note" data-l="É a mesma chave do X-Ray e do Ask Claude. Fica só neste browser e vai só para openrouter.ai.|The same key as the X-Ray and Ask Claude. It stays in this browser and goes only to openrouter.ai."></p>
  <div class="row"><button class="ghost" type="button" onclick="this.closest('dialog').close()" data-l="Fechar|Close"></button></div>
</dialog>

<script type="module">
import { AGENTS, ask } from '/admin/tools/xray-ask.mjs'
const $ = id => document.getElementById(id)
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
const redact = s => String(s || '').replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}/g, '[…]').replace(/(?:\+|00)\d{1,3}[\s.-]?\(?\d{2,4}\)?[\s.-]?\d{3,4}[\s.-]?\d{3,4}/g, '[…]')
const host = u => { try { return new URL(u).hostname.replace(/^www\./, '') } catch { return '' } }
const PLANNER = 'anthropic/claude-haiku-5.5', TRIES = 3 // the planner is cheap too (Silvio, 12 November): Haiku, not Sonnet
// the agent under test: the presenter picks one, and the screen always names it
// only cheap agents (Silvio, 12 November): each costs well under a cent for the 15 runs
const MODELS = [['openai/gpt-5.4-nano', 'GPT-5.4 nano'], ['mistralai/mistral-nemo', 'Mistral Nemo'], ['meta-llama/llama-3.1-8b-instruct', 'Llama 3.1 8B'], ['anthropic/claude-haiku-5.5', 'Claude Haiku 5.5']]
const sget = k => { try { return localStorage.getItem(k) } catch { return null } }, sput = (k, v) => { try { localStorage.setItem(k, v) } catch {} }
let LANG = sget('lab.lang') === 'en' ? 'en' : 'pt', AGENT_MODEL = MODELS.some(m => m[0] === sget('lab.agent')) ? sget('lab.agent') : MODELS[0][0]
const L = (pt, en) => LANG === 'en' ? en : pt
const B = x => x && typeof x === 'object' ? (x[LANG] || x.pt || x.en || '') : String(x || '')
const mname = id => (MODELS.find(m => m[0] === id) || [id, id])[1]

/* ---------- the key: the X-Ray's (xr.orkey) or Ask Claude's (cc.or.key), on this device only ---------- */
const getKey = () => { const a = sget('xr.orkey'); if (a) return a; try { const b = sget('cc.or.key'); return b ? String(JSON.parse(b) || '') : '' } catch { return '' } }
let KEY = getKey(), COST = 0
const kpaint = () => { const k = $('keyb'); k.textContent = KEY ? L('● Chave neste aparelho', '● Key on this device') : L('○ Sem chave', '○ No key'); k.className = 'pill ' + (KEY ? 'on' : 'off'); $('keyst').textContent = KEY ? L('✓ Este aparelho já tem a chave.', '✓ This device has the key.') : L('Este aparelho ainda não tem a chave. Cola-a aqui.', 'This device has no key yet. Paste it here.') }
const cpaint = () => { $('cost').textContent = COST ? L('gasto', 'spent') + ' $' + COST.toFixed(3) : '' }
const addCost = c => { if (typeof c === 'number') { COST += c; cpaint() } }
$('keyb').onclick = () => $('keyd').showModal(); $('whyb').onclick = () => $('whyd').showModal()
$('ksave').onclick = () => { const v = $('kin').value.trim(); if (!/^sk-or-/.test(v)) { $('keyst').textContent = L('Isto não parece uma chave do OpenRouter (começa por sk-or-).', 'That does not look like an OpenRouter key (it starts with sk-or-).'); return } sput('xr.orkey', v); if (!sget('cc.or.key')) sput('cc.or.key', JSON.stringify(v)); KEY = v; $('kin').value = ''; kpaint(); $('keyd').close() }

async function or(body) {
  const r = await fetch('https://openrouter.ai/api/v1/chat/completions', { method: 'POST', headers: { Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json', 'X-Title': 'RiskMandate lab (stand)' }, body: JSON.stringify({ usage: { include: true }, ...body }) })
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status))
  addCost(j.usage && j.usage.cost); return j }
const jsonOf = t => { t = String(t || '').replace(/```(?:json)?/g, ''); try { return JSON.parse(t.slice(t.indexOf('{'), t.lastIndexOf('}') + 1)) } catch { return null } }

/* ---------- language: every fixed text carries data-l="pt|en"; the rest is drawn again ---------- */
function lang(l) { LANG = l; sput('lab.lang', l); document.documentElement.lang = l === 'en' ? 'en' : 'pt-PT'
  document.querySelectorAll('[data-l]').forEach(e => e.innerHTML = e.dataset.l.split('|')[l === 'en' ? 1 : 0])
  document.querySelectorAll('[data-ph]').forEach(e => e.placeholder = e.dataset.ph.split('|')[l === 'en' ? 1 : 0])
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)))
  document.title = 'Lab · X-Ray → ' + L('Três escudos', 'Three shields')
  kpaint(); cpaint(); sugg(); engPaint(); if (P) s2paint(); if (RUN) { s3paint(); if (SEL) show(...SEL) } if (RUN && RUN.over) final() }
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => lang(b.dataset.lang))

/* ---------- step bar ---------- */
const step = n => document.querySelectorAll('#steps span').forEach(s => { const k = +s.dataset.s; s.className = k < n ? 'done' : k === n ? 'now' : '' })

/* ---------- names: the companies of promptugal.news ---------- */
fetch('https://promptugal.news/api/v1/companies.json').then(r => r.json()).then(j => { const N = (Array.isArray(j) ? j : j.companies || []).map(c => c.name || c.title || c).filter(x => typeof x === 'string'); $('colist').innerHTML = N.map(n => `<option value="${esc(n)}">`).join('') }).catch(() => {})
const sugg = () => { $('sugg').innerHTML = `<span class="note" style="align-self:center">${L('Exemplos:', 'Examples:')}</span>` + ['Feedzai', 'Klarna', 'Cloudflare', 'Fidelidade', 'Replit', 'Atlassian'].map(n => `<button type="button">${n}</button>`).join('') }
$('sugg').onclick = e => { const b = e.target.closest('button'); if (b) { $('co').value = b.textContent; $('co').focus() } }
$('co').onkeydown = e => { if (e.key === 'Enter') $('xgo').click() }

/* ---------- step 1: the live X-Ray ---------- */
let X = null, ENG = {}
function engPaint() { const ids = Object.keys(ENG); if (!ids.length) return
  $('eng').innerHTML = ids.map(id => { const e = ENG[id]; const txt = e.st === 'run' ? L('a pesquisar… ', 'searching… ') + e.s + ' s' : e.st === 'ok' ? `✓ ${e.n} ${L('pistas', 'leads')} · ${e.c} ${L('fontes', 'sources')} · ${e.t} s` : e.st === 'empty' ? L('respondeu sem dados', 'answered without data') : '✕ ' + e.err
    return `<div><b>${esc(AGENTS[id].label)}</b><small>${esc(AGENTS[id].model)}</small><div class="st ${e.st === 'run' ? 'run' : e.st === 'ok' ? 'ok' : 'err'}">${esc(txt)}</div></div>` }).join('') }
$('xgo').onclick = async () => {
  const name = $('co').value.trim(); if (!name) return $('co').focus()
  if (!KEY) { $('keyd').showModal(); return }

    : L('Nenhum escudo chega sozinho. <span>A RiskMandate mede o que os teus agentes conseguem mesmo fazer, e prova cada camada.</span>', 'No single shield is enough. <span>RiskMandate measures what your agents can really do, and proves every layer.</span>')
  if (!$('s4').dataset.seen) { $('s4').dataset.seen = '1'; $('s4').scrollIntoView({ behavior: 'smooth', block: 'start' }) } $('xgo').disabled = false }
function reset() { X = P = RUN = SEL = null; ENG = {}; ['s2', 's3', 's4'].forEach(s => $(s).classList.add('hidden')); delete $('s4').dataset.seen; $('ev').classList.add('hidden'); $('eng').innerHTML = ''; $('srcs').innerHTML = ''; $('xfail').innerHTML = ''; COST = 0; cpaint() }
$('again').onclick = () => { reset(); step(1); $('xrun').classList.add('hidden'); $('co').value = ''; scrollTo({ top: 0, behavior: 'smooth' }); $('co').focus() }
$('other').onclick = () => { const i = MODELS.findIndex(m => m[0] === AGENT_MODEL); AGENT_MODEL = MODELS[(i + 1) % MODELS.length][0]; sput('lab.agent', AGENT_MODEL); delete $('s4').dataset.seen; shields() }
lang(LANG); step(1)
</script>
