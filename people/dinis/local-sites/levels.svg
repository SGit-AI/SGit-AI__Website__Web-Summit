<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="600" fill="#f6f3ec"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#121317">One publication, three levels of place</text>
<text x="40" y="80" font-size="15" fill="#555">Every site is PrompTugal.news. What changes is where it is centred.</text>
<g font-size="15">
<rect x="250" y="110" width="460" height="64" rx="10" fill="#fffdf8" stroke="#d9d2c1" stroke-width="2"/>
<text x="480" y="138" text-anchor="middle" font-weight="700" fill="#121317">Europe and the world</text>
<text x="480" y="160" text-anchor="middle" fill="#555">international AI news, carried by promptugal.news</text>
<rect x="200" y="210" width="560" height="74" rx="10" fill="#121317"/>
<text x="480" y="242" text-anchor="middle" font-weight="700" font-size="19" fill="#fff">Portugal · promptugal.news</text>
<text x="480" y="266" text-anchor="middle" fill="#ddd">the national site</text>
<rect x="250" y="320" width="460" height="74" rx="10" fill="#006600"/>
<text x="480" y="352" text-anchor="middle" font-weight="700" font-size="19" fill="#fff">Algarve · algarve.promptugal.news</text>
<text x="480" y="376" text-anchor="middle" fill="#e2eedf">the region</text>
</g>
<g font-size="12.5" font-weight="700" fill="#fff">
<rect x="40" y="440" width="104" height="44" rx="8" fill="#c52830"/><text x="92" y="467" text-anchor="middle">Faro</text>
<rect x="154" y="440" width="104" height="44" rx="8" fill="#c52830"/><text x="206" y="467" text-anchor="middle">Loulé</text>
<rect x="268" y="440" width="104" height="44" rx="8" fill="#c52830"/><text x="320" y="467" text-anchor="middle">Silves</text>
<rect x="382" y="440" width="104" height="44" rx="8" fill="#c52830"/><text x="434" y="467" text-anchor="middle">Tavira</text>
<rect x="496" y="440" width="104" height="44" rx="8" fill="#c52830"/><text x="548" y="460" text-anchor="middle">Vila Real de</text><text x="548" y="476" text-anchor="middle">S. António</text>
<rect x="610" y="440" width="104" height="44" rx="8" fill="#c52830"/><text x="662" y="467" text-anchor="middle">Portimão</text>
<rect x="724" y="440" width="104" height="44" rx="8" fill="#c52830"/><text x="776" y="467" text-anchor="middle">Lagos</text>
<rect x="838" y="440" width="82" height="44" rx="8" fill="#fffdf8" stroke="#c52830" stroke-width="2"/><text x="879" y="467" text-anchor="middle" fill="#c52830">+ 10 more</text>
</g>
<text x="480" y="512" text-anchor="middle" font-size="14" fill="#121317"><tspan font-weight="700">The towns</tspan> · faro.promptugal.news, loule.promptugal.news, … (all 16 municipalities, and Quarteira)</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<g stroke-width="3" fill="none">
<path d="M195 150 C150 260 150 360 170 430" stroke="#121317" marker-end="url(#a)"/>
<path d="M790 430 C825 360 825 260 785 150" stroke="#c52830" marker-end="url(#a)"/>
</g>
<text x="20" y="300" font-size="14" font-weight="700" fill="#121317">Down</text>
<text x="20" y="320" font-size="12.5" fill="#333">wider news that</text><text x="20" y="336" font-size="12.5" fill="#333">matters here</text>
<text x="848" y="300" font-size="14" font-weight="700" fill="#c52830">Up</text>
<text x="848" y="320" font-size="12.5" fill="#333">local sources,</text><text x="848" y="336" font-size="12.5" fill="#333">rising when</text><text x="848" y="352" font-size="12.5" fill="#333">they matter</text>
<rect x="40" y="540" width="880" height="40" rx="8" fill="#fffdf8" stroke="#d9d2c1"/>
<text x="480" y="565" text-anchor="middle" font-size="14" fill="#121317"><tspan font-weight="700">Every level passes the same test:</tspan> is this a PrompTugal story? (it connects to AI)</text>
</svg>
