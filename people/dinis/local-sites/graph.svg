<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="600" fill="#f6f3ec"/>
<text x="40" y="52" font-size="26" font-weight="700" fill="#121317">Everything is a graph: stories connect places, people and AI</text>
<text x="40" y="80" font-size="15" fill="#555">Each site reads the same graph from a different centre. Example: one story about a company in Loulé.</text>
<g stroke="#9a9384" stroke-width="2">
<line x1="480" y1="320" x2="250" y2="200"/><line x1="480" y1="320" x2="710" y2="200"/><line x1="480" y1="320" x2="200" y2="320"/><line x1="480" y1="320" x2="710" y2="450"/><line x1="480" y1="320" x2="480" y2="520"/>
<line x1="250" y1="200" x2="130" y2="320"/><line x1="130" y1="320" x2="130" y2="450"/><line x1="130" y1="450" x2="130" y2="545"/>
<line x1="710" y1="200" x2="850" y2="140"/><line x1="710" y1="450" x2="850" y2="520"/>
</g>
<g font-size="11.5" fill="#666" font-style="italic">
<text x="340" y="250">about</text><text x="590" y="250">uses</text><text x="280" y="312">located in</text><text x="600" y="400">sourced from</text><text x="488" y="440">at</text>
<text x="160" y="255">located in</text><text x="138" y="390">part of</text><text x="138" y="502">part of</text><text x="690" y="150">is a kind of</text><text x="760" y="500" text-anchor="end">published by</text>
</g>
<g font-size="14" font-weight="700" text-anchor="middle">
<rect x="390" y="290" width="180" height="60" rx="10" fill="#121317"/><text x="480" y="316" fill="#fff">Story</text><text x="480" y="336" fill="#ddd" font-weight="400" font-size="12">written once</text>
<rect x="170" y="175" width="160" height="50" rx="25" fill="#fffdf8" stroke="#121317" stroke-width="2"/><text x="250" y="205" fill="#121317">Company</text>
<rect x="630" y="175" width="160" height="50" rx="25" fill="#006600"/><text x="710" y="205" fill="#fff">AI topic</text>
<rect x="770" y="115" width="160" height="50" rx="25" fill="#e2eedf" stroke="#006600" stroke-width="2"/><text x="850" y="145" fill="#006600">AI (the test)</text>

<rect x="60" y="295" width="140" height="50" rx="25" fill="#c52830"/><text x="130" y="325" fill="#fff">Loulé</text>
<rect x="60" y="425" width="140" height="50" rx="25" fill="#006600"/><text x="130" y="455" fill="#fff">Algarve</text>
<rect x="60" y="520" width="140" height="50" rx="25" fill="#121317"/><text x="130" y="550" fill="#fff">Portugal</text>
<rect x="630" y="425" width="160" height="50" rx="25" fill="#fffdf8" stroke="#121317" stroke-width="2"/><text x="710" y="455" fill="#121317">Source</text>
<rect x="770" y="495" width="160" height="50" rx="25" fill="#fffdf8" stroke="#d9d2c1" stroke-width="2"/><text x="850" y="519" fill="#121317" font-size="12.5">regional press,</text><text x="850" y="535" fill="#121317" font-size="12.5">council, university</text>
<rect x="400" y="495" width="160" height="50" rx="25" fill="#fffdf8" stroke="#121317" stroke-width="2"/><text x="480" y="525" fill="#121317">Event</text>
</g>
<text x="40" y="590" font-size="12.5" fill="#555">The path Story → AI topic → AI passes the test. The path Story → Loulé → Algarve → Portugal says where it shows, and how big.</text>
</svg>
