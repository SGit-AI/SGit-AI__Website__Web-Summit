<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A6 mock: the trace page, with the rules</title><link rel="stylesheet" href="flow.css">
<!-- lima.large.worker@PrompTugal.angelo, prod-pipeline-a6 (design mock, static, not live). A3's trace page (8193766) and A5's
     renderer (3af1628, trace-home-rules.htm), with A4's fixes (0905d30): the header gives the page's own span, template changes
     are one folded column at the end, empty lanes are not drawn; and A5's: one column per minute, by agent at most 7 lanes then
     "+N more". (default) Wexio, 77 steps (Fringe 893d4e6, as A3 reduced them); #small DISTRICT 909 (A4's trace);
     #big the home page's last change (A5's trace). Add -open to the hash (or press the button) for the lanes. -->
</head><body><main>
<h1>How this page was made</h1>
<p class="dek" id="dek">Every step behind one Tech Fringe event page, from the record.</p>
<section class="fs" data-flow="strip" aria-labelledby="fs-h" id="strip"></section>
<section class="fp" data-flow="plot" aria-labelledby="fp-h">
 <div class="fp-top"><h2 id="fp-h"></h2>
  <div class="fp-btns"><button class="btn opt" type="button" aria-pressed="false" id="by">By agent</button><button class="btn opt" type="button" id="rp">&#9654; Replay</button><button class="btn" type="button" aria-expanded="false" aria-controls="sc" id="tg">Show the flow</button></div></div>
 <ul class="ov" aria-label="Steps per lane; ringed marks are the strip's stations"></ul>
 <div class="sc" id="sc" tabindex="0" aria-label="The flow, step by step; scrolls sideways"><div class="grid"></div></div>
 <p class="fp-note" id="note"></p>
</section>
</main>
<script>
const LANES=['People','Source','Research','Lead','Build','CI'];
const st=(c,n,l,t)=>'<li class="'+c+'"><a href="#s-'+n+'"><span class="fs-d"></span><span data-flow-label>'+l+'</span><span class="fs-t">'+t+'</span></a></li>';
// [step, lane, time, kind, undated, agent]
const S=[[1,0,"10:24","human",0],[2,0,"10:27","human",1],[3,3,"10:27","agent",0],[4,3,"10:37","agent",0],[5,0,"10:41","human",1],[6,0,"10:57","human",1],[7,1,"10:57","source-read",0],[8,2,"10:58","agent",0],[9,3,"10:58","agent",0],[10,5,"10:59","ci",0],[11,5,"10:59","deploy",0],[12,1,"11:23","source-read",0],[13,2,"11:25","agent",0],[14,3,"11:27","agent",0],[15,0,"11:37","human",1],[16,0,"11:37","human",0],[17,1,"11:40","source-read",0],[18,3,"11:40","agent",0],[19,5,"11:40","ci",0],[20,5,"11:40","deploy",0],[21,3,"11:41","sub-agent",0],[22,5,"11:42","ci",0],[23,5,"11:42","deploy",0],[24,4,"11:42","agent",0],[25,5,"11:42","ci",0],[26,4,"11:42","agent",0],[27,5,"11:42","deploy",0],[28,3,"11:43","agent",0],[29,4,"11:54","agent",0],[30,5,"11:54","ci",0],[31,4,"11:54","agent",0],[32,4,"11:54","agent",0],[33,4,"11:54","agent",0],[34,5,"11:54","ci",0],[35,5,"11:54","deploy",0],[36,5,"11:54","ci",0],[37,1,"11:55","source-read",0],[38,4,"11:55","agent",0],[39,5,"11:55","deploy",0],[40,5,"11:55","ci",0],[41,5,"11:55","deploy",0],[42,4,"11:55","agent",0],[43,4,"11:55","agent",0],[44,5,"11:55","ci",0],[45,5,"11:55","deploy",0],[46,5,"11:56","ci",0],[47,2,"11:56","agent",0],[48,5,"11:56","ci",0],[49,4,"11:56","agent",0],[50,5,"11:56","deploy",0],[51,5,"11:56","deploy",0],[52,4,"11:56","agent",0],[53,5,"11:56","ci",0],[54,4,"11:56","agent",0],[55,5,"11:56","deploy",0],[56,4,"11:57","agent",0],[57,3,"11:57","agent",0],[58,5,"11:57","deploy",0],[59,5,"11:57","ci",0],[60,4,"11:57","agent",0],[61,5,"11:57","ci",0],[62,5,"11:57","deploy",0],[63,4,"11:57","agent",0],[64,5,"11:58","ci",0],[65,5,"11:58","deploy",0],[66,5,"11:58","deploy",0],[67,4,"11:58","agent",0],[68,4,"11:58","agent",0],[69,4,"11:58","agent",0],[70,4,"12:02","agent",0],[71,4,"12:02","agent",0],[72,5,"12:02","ci",0],[73,4,"12:02","agent",0],[74,5,"12:02","ci",0],[75,5,"12:02","deploy",0],[76,5,"12:03","deploy",0],[77,4,"12:03","agent",0]];
const V={
 normal:{dek:'Every step behind one Tech Fringe event page, from the record.',S:S,STN:[2,7,9,15,24,27,33,66,76],tpl:0,
  head:'77 steps, 6 lanes, 10:24 to 12:03',
  strip:'<p class="fs-k">How this page was made</p><h2 class="fs-h" id="fs-h">From the organiser\'s page to live in 46 min <span>· 3 people · 15 agents · 38 commits</span></h2><ol class="fs-line">'+st('s-ask',2,'Asked','10:27')+st('s-read quiet',7,'Read','10:57')+st('lv3',9,'Entry','10:58')+st('lv4 quiet s-person',15,'Dinis','11:37')+st('lv4',24,'Built','11:42')+st('s-live',27,'Live','11:42')+st('lv4 quiet',33,'26 commits','11:54')+st('s-fail lv2',66,'5 failed','11:58')+st('s-now',76,'Now','12:03')+'</ol><p class="fs-f"><a href="#fp-h">See every step</a> · from the git record · taken 12:05</p>',
  note:'One mark per minute and lane (a number: several steps); ringed in yellow: the strip\'s stations; dashed: no time in the record. By agent needs the agent on each step (the build has it; this mock\'s Wexio data does not).'},
 small:{dek:'Every step behind the DISTRICT 909 event page, from the git record (A4\'s trace).',
  S:[[1,0,'17:49','human',1],[2,1,'17:49','source-read',0,0],[3,2,'17:50','agent',0,0],[4,5,'17:50','deploy',1]],STN:[],tpl:3,tplEnd:'19:12',AG:['researcher.1'],
  head:'4 steps, 1 agent, 17:49 to 17:50 <span class="fs-t">· then 3 template changes to 19:12</span>',
  strip:'<p class="fs-k" id="fs-h">How this page was made</p><p class="fs-s">A research agent read the organisers’ Luma page at 17:49 and added this event at 17:50, after a team member passed on the link. Live as v0.1.422.</p><p class="fs-f"><a href="#fp-h">See all 4 steps</a> · from the git record</p>',
  one:true,note:'4 lanes of 6: lanes with no step are not drawn. Dashed: no time in the record (the link was passed on before 17:49; the release v0.1.422 has no deploy time in git). Dotted square: template changes, folded.'},
 big:{dek:'The last change behind the Tech Fringe home page, from the git record (A5\'s trace).',
  S:[[132,4,'18:52','agent',0,0],[133,3,'18:56','agent',0,1],[134,3,'19:03','agent',0,2],[135,1,'19:13','agent',0,3]],STN:[132,133,134,135],tpl:0,
  AG:['design.4','conductor·indi','architect.1','dev.2'],
  head:'The last change: 4 steps, 4 agents, 18:52 to 19:13',
  strip:'<p class="fs-k">How this page was made</p><h2 class="fs-h" id="fs-h">Last change: 21 min <span>· 4 commits · 4 agents</span></h2><ol class="fs-line">'+st('s-ask',132,'Started','18:52')+st('quiet',132,'design.4','18:52')+st('lv3 quiet',133,'conductor','18:56')+st('lv3 lv4 quiet',134,'architect.1','19:03')+st('s-live',135,'Live','19:13')+st('s-now',135,'Now','19:26')+'</ol><p class="fs-f"><a href="#fp-h">See this change</a> <span class="hist">· All 135 commits</span></p>',
  note:'One mark per minute and lane. Earlier: 1 change, 131 steps, 21 agents since 10:42, in the dated history file (trace-2026-11-11.json in the build). By agent: at most 7 lanes, then "+N more".'}
};
const key=(location.hash.match(/^#(small|big)/)||[,'normal'])[1], v=V[key], S2=v.S, STN=new Set(v.STN), CAP=7;
document.getElementById('dek').textContent=v.dek; const strip=document.getElementById('strip'); strip.innerHTML=v.strip; if(v.one) strip.classList.add('fs-one');
document.getElementById('fp-h').innerHTML=v.head; document.getElementById('note').textContent=v.note;
const mn=(t)=>+t.slice(0,2)*60+ +t.slice(3), t0=mn(S2[0][2]), t1=Math.max(mn(S2[S2.length-1][2]),t0+1);
const sec=document.querySelector('.fp'), ov=sec.querySelector('.ov'), grid=sec.querySelector('.grid'), tg=document.getElementById('tg'), by=document.getElementById('by');
if(!v.AG) by.hidden=true;
function rows(agent){ let R;
  if(!agent) R=LANES.map((l,i)=>({l,f:(s)=>s[1]===i,k:'k'+i}));
  else { const n={}; S2.forEach(s=>{if(s[5]!==undefined) n[s[5]]=(n[s[5]]||0)+1}); const order=Object.keys(n).map(Number).sort((a,b)=>n[b]-n[a]);
    const top=order.slice(0,CAP); R=top.map((a,i)=>({l:v.AG[a],f:(s)=>s[5]===a,k:'k'+(i%5+1)}));
    if(order.length>CAP) R.push({l:'+'+(order.length-CAP)+' more',f:(s)=>s[5]!==undefined&&!top.includes(s[5]),k:'k0'}); }
  return R.filter(r=>S2.some(r.f)); }   // no empty lanes (A4)
function draw(agent){ const R=rows(agent);
  ov.innerHTML=R.map((r)=>{const ss=S2.filter(r.f);return '<li class="'+r.k+'"><span data-flow-label>'+r.l+'</span><span class="bar" aria-hidden="true">'+ss.map(s=>'<i class="'+(STN.has(s[0])?'st':'')+'" style="left:'+((mn(s[2])-t0)/(t1-t0)*100).toFixed(1)+'%"></i>').join('')+'</span><span class="n">'+ss.length+'</span></li>'}).join('');
  const cols=[]; S2.forEach((s)=>{const c=cols[cols.length-1]; if(c&&c.t===s[2]) c.s.push(s); else cols.push({t:s[2],s:[s]})});   // one column per minute (A5 rule 3)
  let last=-9, prev=null; const ax=cols.map((c,i)=>{const m=mn(c.t), gap=prev!==null&&m-prev>5; const show=(gap||m!==prev)&&i-last>=3; prev=m; if(!show) return '<span class="cell"></span>'; last=i; return '<span class="cell'+(gap?' gap':'')+'"><span data-flow-label>'+c.t+'</span></span>'});
  if(v.tpl) ax.push('<span class="cell gap"><span data-flow-label>'+v.tplEnd+'</span></span>');
  grid.innerHTML='<div class="ax"><span class="ln"></span>'+ax.join('')+'</div>'+R.map((r,ri)=>'<div class="row '+r.k+'"><span class="ln" data-flow-label>'+r.l+'</span>'+cols.map((c,i)=>{const h=c.s.filter(r.f); if(!h.length) return '<span class="cell"></span>'; const s=h[0], stn=h.some(x=>STN.has(x[0]));
    return '<span class="cell"><a id="s-'+s[0]+'" href="#s-'+s[0]+'" style="--i:'+i+'" class="'+(s[4]?'u ':'')+(s[3]==='ci'?'ci ':s[3]==='deploy'?'dep ':'')+(stn?'st':'')+'" aria-label="'+c.t+' UTC, '+h.length+' step'+(h.length>1?'s':'')+', '+r.l+'">'+(h.length>1?'<b>'+h.length+'</b>':'')+'</a>'+h.slice(1).map(x=>'<span id="s-'+x[0]+'"></span>').join('')+'</span>'}).join('')
    +(v.tpl?'<span class="cell">'+(r.l==='Build'||(ri===R.length-1&&!R.some(x=>x.l==='Build'))?'<a class="tpl" href="#tpl" aria-label="'+v.tpl+' template changes, folded"><b>+'+v.tpl+'</b></a>':'')+'</span>':'')+'</div>').join('');
  grid.dataset.cols=cols.length; grid.dataset.rows=R.length; }
draw(false);
const set=(o)=>{sec.classList.toggle('open',o);tg.setAttribute('aria-expanded',o);tg.textContent=o?'Overview':'Show the flow'};
tg.addEventListener('click',()=>set(!sec.classList.contains('open')));
by.addEventListener('click',()=>{const p=by.getAttribute('aria-pressed')!=='true';by.setAttribute('aria-pressed',p);draw(p)});
document.getElementById('rp').addEventListener('click',()=>{grid.classList.remove('replay');void grid.offsetWidth;grid.classList.add('replay')});
if(/open|agent|^#s-/.test(location.hash)) set(true);
if(/agent/.test(location.hash)&&v.AG){by.setAttribute('aria-pressed','true');draw(true)}
</script></body></html>
