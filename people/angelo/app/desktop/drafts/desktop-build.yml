# DRAFT for conductor@web-summit.dinis (workflows are shared; dev.app@PrompTugal.angelo never edits .github/).
# If accepted: copy to .github/workflows/desktop-build.yml. It builds the hexagon app (people/angelo/app/desktop/)
# on GitHub's own Windows and macOS machines and keeps the unsigned installers on one GitHub release, "desktop-latest",
# replaced at each build. The release is storage only, linked from nowhere: the site's own deploy copies its files into
# people/angelo/app/desktop/dl/ (drafts/deploy-pages-step.md), so the team downloads them from web-summit.sgit.ai
# (the kit's "Our own website first", 9f3f449, 8 November). After a build it asks for one deploy, so the files reach the
# site at once; otherwise the next release carries them. It never touches the site's version or tags.
name: desktop app
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['people/angelo/app/desktop/**']
permissions:
  contents: write          # only to replace the desktop-latest release's files
  actions: write           # only to ask deploy-pages for one deploy once the files are there
concurrency: { group: desktop-build, cancel-in-progress: true }
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, args: '--target universal-apple-darwin', name: mac }
          - { os: windows-latest, args: '', name: windows }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: people/angelo/app/desktop/src-tauri } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}" }
      - name: icons (made from icons/icon-1024.png, never committed)
        run: npx -y @tauri-apps/cli@2 icon ../icons/icon-1024.png
      - name: the hit test
        if: matrix.name == 'mac'
        run: rustc --edition 2021 --test src/hex.rs -o hex-test && ./hex-test
      - name: build (unsigned)
        run: npx -y @tauri-apps/cli@2 build ${{ matrix.args }}
      - name: collect the installer
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ matrix.name }}" = mac ]; then cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/Team-and-the-machine-mac.dmg"
          else cp target/release/bundle/nsis/*-setup.exe "out/Team-and-the-machine-windows-setup.exe"; fi
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: people/angelo/app/desktop/src-tauri/out/* }
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: builds.json, which the download page reads (the time, the commit, each file's system and size)
        run: |
          node -e '
            const fs = require("fs"), files = fs.readdirSync("out")
            const os = f => /mac/i.test(f) ? "Mac" : /windows/i.test(f) ? "Windows" : ""
            fs.writeFileSync("out/builds.json", JSON.stringify({ built: new Date().toISOString(), commit: process.argv[1],
              files: files.filter(os).map(f => ({ os: os(f), file: f, bytes: fs.statSync("out/" + f).size })) }, null, 1))' "${{ github.sha }}"
      - name: replace the desktop-latest release's files
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: |
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --prerelease --target "${{ github.sha }}" --title "Team and the machine: desktop app (storage for the site)" --notes "Storage only: the site's deploy copies these files to https://web-summit.sgit.ai/people/angelo/app/desktop/dl/, the one place the team downloads them from (https://web-summit.sgit.ai/people/angelo/app/desktop/index.html). Built from people/angelo/app/desktop at each change; unsigned."
          gh release upload desktop-latest out/* --clobber
      - name: serve them from the site now (one deploy of dev; the deploy copies them into dl/)
        env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: gh workflow run deploy-pages.yml --ref dev
