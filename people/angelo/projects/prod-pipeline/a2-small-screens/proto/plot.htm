<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2 prototype: the swim lanes on small screens</title>
<!-- foxtrot.large.worker@PrompTugal.angelo, a2-small-screens (prototype, not live). Data: the 77 steps of the Fringe's
     Wexio trace (team/angelo/traces/, 893d4e6), reduced to step number, lane, time and kind; no names.
     Closed (default): one overview of the six lanes, under 0.6 of the first screen, and a "Show the flow" button.
     Open (the button, or #open): the lanes keep their shape at every width; the diagram scrolls inside its own box
     (never the page), each mark is a 44 px target, lane names stay pinned at the left. -->
<style>
:root{--paper:#f6f3ec;--panel:#fffdf8;--ink:#121317;--ink-3:#595c64;--hair:#d9d2c1;--lane:#ece7db;--brand:#1f4fa8;--red:#c52830;--green:#006600;--teal:#1f7f7f;--org:#b4532d;--focus:#ffbf1f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15161a;--panel:#1d1f24;--ink:#f0ede6;--ink-3:#b4b1aa;--hair:#3a3c42;--lane:#24262c;--brand:#8db0f5;--red:#f08a8a;--green:#7fd08f;--teal:#6fc9c9;--org:#f0a07c}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:12px 16px}
h1{font:700 22px/1.2 Georgia,serif;margin:4px 0}.dek{margin:0 0 8px;font-size:14px;color:var(--ink-3)}
.fp{background:var(--panel);border:1px solid var(--hair);border-radius:6px;padding:8px 10px}
.fp-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px}
.fp-top h2{font:700 15px/1.3 system-ui;margin:0}
.fp-btn{min-height:44px;min-width:44px;padding:0 14px;border:2px solid var(--brand);border-radius:22px;background:var(--panel);color:var(--brand);font:600 14px system-ui;cursor:pointer}
.fp-btn:focus-visible,.fp a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ov{margin:6px 0 0;padding:0;list-style:none}
.ov li{display:grid;grid-template-columns:76px 1fr 28px;align-items:center;gap:6px;height:22px}
.ov .bar{position:relative;height:10px;background:var(--lane);border-radius:5px}
.ov i{position:absolute;top:2px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:currentColor}
[data-flow-label]{font:600 12px/1.2 system-ui}.ov .n{font:12px ui-monospace,monospace;color:var(--ink-3);text-align:right}
.k0{color:var(--org)}.k1{color:var(--teal)}.k2,.k3,.k4{color:var(--brand)}.k5{color:var(--green)}.kd{color:var(--green)}
.sc{display:none;overflow:auto;max-height:calc(60vh - 120px);margin-top:6px;border-top:1px solid var(--hair);overscroll-behavior-x:contain}
.open .sc{display:block}.open .ov,.open .fp-note{display:none}
.grid{position:relative}
.row{display:flex;height:44px;border-bottom:1px solid var(--hair)}
.row:nth-child(odd){background:var(--lane)}
.ln{position:sticky;left:0;z-index:2;flex:0 0 76px;display:flex;align-items:center;padding-left:6px;background:inherit;background-color:var(--panel)}
.row:nth-child(odd) .ln{background-color:var(--lane)}
.cell{flex:0 0 46px;display:flex;align-items:center;justify-content:center}
.cell a{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;color:inherit}
.cell a::before{content:"";width:14px;height:14px;border-radius:50%;background:currentColor}
.cell a.u::before{background:transparent;border:3px dashed currentColor}
.cell a.ci::before{border-radius:2px}.cell a.dep::before{border-radius:2px;transform:rotate(45deg)}
.ax{display:flex;height:28px;position:sticky;top:0;z-index:3;background:var(--panel)}
.ax .ln{z-index:4}
.ax .cell{justify-content:flex-start;overflow:visible}
.ax span[data-flow-label]{font:12px/1 ui-monospace,monospace;color:var(--ink-3);white-space:nowrap}
.ax .gap span[data-flow-label]{color:var(--org)}
.fp-note{font-size:13px;color:var(--ink-3);margin:6px 0 0}
@media (max-height:420px) and (orientation:landscape){.ov li{height:16px}.ov{margin-top:2px}.fp{padding:4px 10px}.fp-note{display:none}h1{font-size:18px}.dek{display:none}}
</style></head><body><main>
<h1>How this page was made</h1>
<p class="dek">Every step that made one Tech Fringe event page, from the record.</p>
<section class="fp" data-flow="plot" aria-labelledby="fp-h">
 <div class="fp-top"><h2 id="fp-h">77 steps, 6 lanes, 10:24 to 12:03</h2>
  <button class="fp-btn" type="button" aria-expanded="false" aria-controls="sc">Show the flow</button></div>
 <ul class="ov" aria-label="Steps per lane"></ul>
 <div class="sc" id="sc" tabindex="0" aria-label="The flow, step by step; scrolls sideways"><div class="grid"></div></div>
 <p class="fp-note">Each mark is one step; dashed marks are untimed (some time before).</p>
</section>
<noscript><p>The steps are listed in order below the diagram (on the live page).</p></noscript>
</main>
<script>
const LANES=['People','Source','Research','Lead','Build','CI'];
const S=[[1,0,"10:24","human",0],[2,0,"10:27","human",1],[3,3,"10:27","agent",0],[4,3,"10:37","agent",0],[5,0,"10:41","human",1],[6,0,"10:57","human",1],[7,1,"10:57","source-read",0],[8,2,"10:58","agent",0],[9,3,"10:58","agent",0],[10,5,"10:59","ci",0],[11,5,"10:59","deploy",0],[12,1,"11:23","source-read",0],[13,2,"11:25","agent",0],[14,3,"11:27","agent",0],[15,0,"11:37","human",1],[16,0,"11:37","human",0],[17,1,"11:40","source-read",0],[18,3,"11:40","agent",0],[19,5,"11:40","ci",0],[20,5,"11:40","deploy",0],[21,3,"11:41","sub-agent",0],[22,5,"11:42","ci",0],[23,5,"11:42","deploy",0],[24,4,"11:42","agent",0],[25,5,"11:42","ci",0],[26,4,"11:42","agent",0],[27,5,"11:42","deploy",0],[28,3,"11:43","agent",0],[29,4,"11:54","agent",0],[30,5,"11:54","ci",0],[31,4,"11:54","agent",0],[32,4,"11:54","agent",0],[33,4,"11:54","agent",0],[34,5,"11:54","ci",0],[35,5,"11:54","deploy",0],[36,5,"11:54","ci",0],[37,1,"11:55","source-read",0],[38,4,"11:55","agent",0],[39,5,"11:55","deploy",0],[40,5,"11:55","ci",0],[41,5,"11:55","deploy",0],[42,4,"11:55","agent",0],[43,4,"11:55","agent",0],[44,5,"11:55","ci",0],[45,5,"11:55","deploy",0],[46,5,"11:56","ci",0],[47,2,"11:56","agent",0],[48,5,"11:56","ci",0],[49,4,"11:56","agent",0],[50,5,"11:56","deploy",0],[51,5,"11:56","deploy",0],[52,4,"11:56","agent",0],[53,5,"11:56","ci",0],[54,4,"11:56","agent",0],[55,5,"11:56","deploy",0],[56,4,"11:57","agent",0],[57,3,"11:57","agent",0],[58,5,"11:57","deploy",0],[59,5,"11:57","ci",0],[60,4,"11:57","agent",0],[61,5,"11:57","ci",0],[62,5,"11:57","deploy",0],[63,4,"11:57","agent",0],[64,5,"11:58","ci",0],[65,5,"11:58","deploy",0],[66,5,"11:58","deploy",0],[67,4,"11:58","agent",0],[68,4,"11:58","agent",0],[69,4,"11:58","agent",0],[70,4,"12:02","agent",0],[71,4,"12:02","agent",0],[72,5,"12:02","ci",0],[73,4,"12:02","agent",0],[74,5,"12:02","ci",0],[75,5,"12:02","deploy",0],[76,5,"12:03","deploy",0],[77,4,"12:03","agent",0]];
const min=(t)=>+t.slice(0,2)*60+ +t.slice(3), t0=min(S[0][2]), t1=min(S[S.length-1][2]);
const sec=document.querySelector('.fp'), ov=sec.querySelector('.ov'), grid=sec.querySelector('.grid'), btn=sec.querySelector('.fp-btn');
ov.innerHTML=LANES.map((l,i)=>{const st=S.filter(s=>s[1]===i);return '<li class="k'+i+'"><span data-flow-label>'+l+'</span><span class="bar" aria-hidden="true">'+st.map(s=>'<i style="left:'+((min(s[2])-t0)/(t1-t0)*100).toFixed(1)+'%"></i>').join('')+'</span><span class="n">'+st.length+'</span></li>'}).join('');
// axis: a time label where the time changes and the last label is at least 3 columns back; a gap over 5 min says so
let last=-9, prev=null; const ax=S.map((s,c)=>{const m=min(s[2]), gap=prev!==null&&m-prev>5; const show=(gap||m!==prev)&&c-last>=3; prev=m; if(!show) return '<span class="cell"></span>'; last=c; return '<span class="cell'+(gap?' gap':'')+'"><span data-flow-label>'+s[2]+'</span></span>'});
grid.innerHTML='<div class="ax"><span class="ln"></span>'+ax.join('')+'</div>'+LANES.map((l,i)=>'<div class="row k'+i+'"><span class="ln" data-flow-label>'+l+'</span>'+S.map(s=>'<span class="cell">'+(s[1]===i?'<a href="#s-'+s[0]+'" class="'+(s[4]?'u ':'')+(s[3]==='ci'?'ci':s[3]==='deploy'?'dep':'')+'" aria-label="'+s[2]+' UTC, '+s[3]+', step '+s[0]+'"></a>':'')+'</span>').join('')+'</div>').join('');
const set=(o)=>{sec.classList.toggle('open',o);btn.setAttribute('aria-expanded',o);btn.textContent=o?'Show the overview':'Show the flow'};
btn.addEventListener('click',()=>set(!sec.classList.contains('open')));
if(location.hash==='#open') set(true);
</script></body></html>
