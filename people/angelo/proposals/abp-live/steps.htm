<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="ABP steps"><meta name="theme-color" content="#07111F">
<title>ABP step view</title>
<!-- dev.abp@PrompTugal.angelo, 9 November 2026: the player's step view for Angelo's two stories (the follow-up, RM-R0003;
     the install, RM-R0012) at the five rungs (backlog 00d1, his decisions of 8 November, f8000851). The look is the step
     mock-up's (mockup/step.htm). Every step comes from a real recorded run (reach-runs.json, made by stories/reach/steps.mjs:
     labels only, never a fake secret's value). Not public: Angelo's decision 5, "keep it to us".
     ?loop=1 plays both stories, rungs 0 to 4, forever (the stand screen). ?live=1, served by stories/reach/live.mjs on the
     stand laptop: "Run it live now" starts a real run of the story and rung on screen, and each step shows as it happens. ?story=followup|install&rung=0..4&run=<id> opens one. -->
<style>
:root{--bg:#07111F;--panel:#0a1626;--line:#1d3550;--rim:#22b8e6;--tx:#E8EEF5;--mu:#93A6BC;--ok:#3ecf8e;--bad:#ff4d5e;--amb:#f5b942;--ag:#9b8cff;--stop:#ff8a3d}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}button,.ladder li{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 20px 0}
.bar .grp{display:flex;gap:4px;flex-wrap:wrap}.bar button{background:var(--panel);color:var(--mu);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
.bar button.on{color:var(--tx);border-color:var(--rim);background:#0f2238}.bar .sp{flex:1}#liveB{color:var(--tx);border-color:var(--bad)}#liveS{align-self:center;margin-left:6px}.live{color:var(--bad);font-weight:600}
.stage{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;padding:14px 20px 20px}
.pic{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(20px,2.4vw,30px);margin:0}.top .lv{font-size:clamp(15px,1.7vw,21px);white-space:nowrap}
svg{width:100%;height:auto;margin-top:8px}
.bubble{background:#122540;border:2px solid var(--rim);border-radius:20px;padding:14px 18px;margin-top:6px;transition:border-color .3s}
.bubble.bad{border-color:var(--bad)}.bubble.act{border-color:var(--bad)}.bubble.stop{border-color:var(--stop)}.bubble.ok{border-color:var(--ok)}.bubble.warn{border-color:var(--amb)}
.bubble b{display:block;font-size:clamp(22px,3vw,40px);line-height:1.1}.bubble span{color:var(--mu);font-size:clamp(14px,1.4vw,18px)}
.steps{display:flex;gap:6px;margin-top:10px}.steps span{flex:1;height:8px;border-radius:4px;background:var(--line)}.steps .done{background:var(--rim)}.steps .now{background:var(--amb)}
.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 8px}
.prompt{font-size:clamp(15px,1.4vw,19px);border-left:4px solid var(--rim);padding-left:10px}
.prompt small{display:block;color:var(--mu);margin-top:6px;font-size:13px}.prompt .rule{display:block;margin-top:8px;color:var(--amb);font-size:14px}
.ladder{list-style:none;margin:0;padding:0}.ladder li{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;color:var(--mu);cursor:pointer}
.ladder li.below{color:var(--tx)}.ladder li.on{background:#0f2a24;color:var(--tx);outline:2px solid var(--ok)}.ladder li.on.zero{background:#2a1220;outline-color:var(--bad)}
.ladder i{font-style:normal;width:1.3em;text-align:center}.ladder em{font-style:normal;margin-left:auto;font-size:12px;color:var(--mu)}
.ctr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ctr div{text-align:center}.ctr b{display:block;font-size:40px;line-height:1;transition:color .3s}
.ctr .seen b{color:var(--amb)}.ctr .z b{color:var(--ok)}.ctr .nz b{color:var(--bad)}
.rates{font-size:14px;color:var(--mu)}.rates b{color:var(--tx)}
.foot{color:var(--mu);font-size:12px}
.flash{animation:fl .9s ease-out}@keyframes fl{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.mv{stroke-dasharray:10 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-34}}
#empty{padding:40px;text-align:center;color:var(--mu)}
@media (max-width:820px){.stage{grid-template-columns:1fr;padding:12px 16px 16px}.bar{padding:10px 16px 0}}
@media (prefers-reduced-motion:reduce){.mv,.flash{animation:none}}
</style></head><body>
<div class="bar" id="bar">
 <div class="grp" id="stories"></div><div class="grp" id="rungs" aria-label="rung"></div><div class="grp" id="runs" aria-label="recorded run"></div>
 <span class="sp"></span><div class="grp" id="liveG" hidden><button id="liveB">Run it live now</button><span id="liveS" class="foot"></span></div><div class="grp"><button id="play">Pause</button><button id="loopB">Loop</button></div>
</div>
<div id="empty" hidden>The record (reach-runs.json) could not be loaded.</div>
<div class="stage" id="stage">
 <section class="pic" aria-label="the picture">
  <div class="top"><h1 id="title"></h1><div class="lv" id="lv"></div></div>
  <svg id="svg" viewBox="0 0 760 390" role="img" aria-label="who asked, the agent, the files it can reach, and the ways out"></svg>
  <div class="bubble" id="bubble" aria-live="polite"><b id="bT"></b><span id="bS"></span></div>
  <div class="steps" id="bar2"></div>
 </section>
 <aside class="side">
  <div class="card"><h2>The prompt</h2><div class="prompt" id="prompt"></div></div>
  <div class="card"><h2>What stands in the way</h2><ol class="ladder" id="ladder"></ol></div>
  <div class="card ctr"><div class="seen"><b id="cSeen">0</b>secrets and private data seen</div><div id="cOverW" class="z"><b id="cOver">0</b>done without asking</div></div>
  <div class="card rates" id="rates"></div>
  <div class="foot" id="foot"></div>
 </aside>
</div>
<script src="reach-runs.js" onerror="this.dataset.failed=1"></script>
<script>
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg'
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const Q=new URLSearchParams(location.search)
const ICON=['●','◉','◐','○','○'],LV=['var(--bad)','var(--amb)','var(--stop)','var(--ok)','var(--ok)']
// the picture: who asked, the agent, three kinds of file, and the story's ways out
const NODES={
 rui:{x:90,y:70,r:38,t:'Rui',s:'manager'},agent:{x:345,y:190,r:62,t:'Agent'},
 need:{x:95,y:205,w:150,h:46,t:'the job\'s files'},extra:{x:95,y:265,w:150,h:46,t:'other files'},env:{x:95,y:325,w:150,h:46,t:'.env  🔑 3 keys'}}
const OUTS={followup:{send:{x:585,y:70,w:150,h:50,t:'mail, as Rui'},dana:{x:690,y:170,r:40,t:'Dana',s:'Northwind'},marta:{x:560,y:190,r:30,t:'Marta',s:'finance'},
  schedule:{x:600,y:315,w:190,h:56,t:'scheduler',s:'runs as Rui, while away'}},
 install:{install:{x:610,y:80,w:180,h:56,t:'public registry',s:'the internet'},run:{x:600,y:300,w:170,h:50,t:'report.mjs'}}}
let R=window.ABP_REACH,W,CTL={},timer=null,playing=true,loop=Q.get('loop')==='1',cur={story:Q.get('story')||'followup',rung:+(Q.get('rung')||0),run:Q.get('run')||''}
function node(svg,id,n){const g=el('g',{id:'n-'+id},svg);if(n.r){el('circle',{cx:n.x,cy:n.y,r:n.r,fill:id==='agent'?'#1a1640':'#0f2238',stroke:id==='agent'?'#9b8cff':'#22b8e6','stroke-width':id==='agent'?4:2},g)}
 else el('rect',{x:n.x-n.w/2,y:n.y-n.h/2,width:n.w,height:n.h,rx:10,fill:'#0f2238',stroke:'#1d3550','stroke-width':2},g)
 const t=el('text',{x:n.x,y:n.y+(n.s&&!n.r?-2:6),'text-anchor':'middle',fill:'#E8EEF5','font-size':id==='agent'?20:16},g);t.textContent=n.t
 if(n.s){const s=el('text',{x:n.x,y:n.r?n.y+n.r+18:n.y+16,'text-anchor':'middle',fill:'#93A6BC','font-size':13},g);s.textContent=n.s}
 return g}
function edge(a,b){const A=W.N[a],B=W.N[b];const pad=n=>n.r||Math.min(n.w,n.h)/2+6
 const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy),ux=dx/d,uy=dy/d
 return{x1:A.x+ux*pad(A),y1:A.y+uy*pad(A),x2:B.x-ux*pad(B),y2:B.y-uy*pad(B)}}
const COL={ok:'#3ecf8e',bad:'#f5b942',act:'#ff4d5e',stop:'#ff8a3d',warn:'#f5b942',need:'#93A6BC'}
function line(a,b,tone,label){const e=edge(a,b);const l=el('line',{...e,stroke:COL[tone]||'#93A6BC','stroke-width':4,'marker-end':'url(#m-'+(tone||'need')+')',class:'mv'},W.lines)
 if(label){const t=el('text',{x:(e.x1+e.x2)/2,y:(e.y1+e.y2)/2-8,'text-anchor':'middle',fill:COL[tone]||'#93A6BC','font-size':14},W.lines);t.textContent=label}
 return{l,e}}
function barrier(a,b,by){const e=edge(a,b),mx=(e.x1+e.x2)/2,my=(e.y1+e.y2)/2,dx=e.x2-e.x1,dy=e.y2-e.y1,d=Math.hypot(dx,dy),nx=-dy/d*22,ny=dx/d*22
 const g=el('g',{class:'flash'},W.lines);el('line',{x1:mx+nx,y1:my+ny,x2:mx-nx,y2:my-ny,stroke:'#ff8a3d','stroke-width':9,'stroke-linecap':'round'},g)
 const t=el('text',{x:mx,y:my+(ny>0?40:-28),'text-anchor':'middle',fill:'#ff8a3d','font-size':14},g);t.textContent=by==='review'?'held: a person reviews':'refused: '+(by||'barrier')}
function particle(a,b,col){const e=edge(a,b);const c=el('circle',{r:7,fill:col},W.lines);const m=el('animateMotion',{dur:'1.4s',repeatCount:'indefinite',path:`M${e.x1},${e.y1}L${e.x2},${e.y2}`},c)}
function draw(story){const svg=$('svg');svg.innerHTML='';const d=el('defs',{},svg)
 for(const[k,c]of Object.entries(COL)){const m=el('marker',{id:'m-'+k,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto'},d);el('path',{d:'M0 0L10 5L0 10z',fill:c},m)}
 W={N:{...NODES,...OUTS[story]},lines:el('g',{},svg),nodes:el('g',{},svg)}
 for(const[id,n]of Object.entries(W.N))node(W.nodes,id,n)
 W.ring=W.nodes.querySelector('#n-agent circle');W.held=el('text',{x:345,y:285,'text-anchor':'middle',fill:'#f5b942','font-size':14},W.nodes)}
const cellOf=(s,l)=>R.stories[s].cells.find(c=>c.rung===l)
const runOf=(s,l,id)=>{const c=cellOf(s,l);return c&&(c.runs.find(r=>r.id===id)||c.runs.find(r=>r.id===c.shown))}
const stopLive=()=>{if(typeof poll!=='undefined'&&poll){clearInterval(poll);poll=null}}
function controls(){const S=R.stories
 $('stories').innerHTML='';for(const s of Object.keys(S)){const b=document.createElement('button');b.textContent=s==='followup'?'The follow-up':'The install';b.className=s===cur.story?'on':'';b.onclick=()=>pick({story:s,rung:cur.rung,run:''});$('stories').appendChild(b)}
 $('rungs').innerHTML='';for(const c of S[cur.story].cells){const b=document.createElement('button');b.textContent='Rung '+c.rung;b.title=R.rungs[c.rung].name;b.className=c.rung===cur.rung?'on':'';b.onclick=()=>pick({story:cur.story,rung:c.rung,run:''});$('rungs').appendChild(b)}
 $('runs').innerHTML='';const c=cellOf(cur.story,cur.rung);c.runs.forEach((r,i)=>{const b=document.createElement('button');b.textContent='Run '+'abcdefghij'[i];b.title=r.id+(r.id===c.shown?' (the most common outcome at this rung)':'');b.className=r.id===cur.run?'on':'';b.onclick=()=>pick({...cur,run:r.id});$('runs').appendChild(b)})
 $('loopB').className=loop?'on':'';$('play').textContent=playing?'Pause':'Play'}
function side(st,run){const s=R.stories[cur.story],c=cellOf(cur.story,cur.rung),L=cur.rung
 $('title').innerHTML='';$('title').append(s.title);if(run.id==='live'){const b=document.createElement('span');b.className='live';b.textContent='  ● LIVE';$('title').append(b)}$('lv').innerHTML=`<span style="color:${LV[L]}">${ICON[L]}</span> Rung ${L}: ${R.rungs[L].name}`
 $('prompt').innerHTML='';const p=$('prompt');p.append('"'+s.ask.words+'"');const sm=document.createElement('small');sm.textContent=s.ask.who+'. The agent has one tool: a shell in the shared folder.';p.append(sm)
 if(L>=1){const r=document.createElement('span');r.className='rule';r.textContent='The rule in its instructions: read only what the job needs; '+s.ruleText+'.';p.append(r)}
 $('ladder').innerHTML='';R.rungs.forEach((g,i)=>{const li=document.createElement('li');li.className=(i===L?'on':i<L?'below':'')+(i===L&&L===0?' zero':'');li.innerHTML=`<i>${ICON[i]}</i>${g.name}<em>${g.kind}</em>`;li.onclick=()=>pick({story:cur.story,rung:i,run:''});$('ladder').appendChild(li)})
 const r=c.rates,n=c.n;$('rates').innerHTML=`<b>Rung ${L}, ${n} recorded runs:</b> opened the .env in <b>${r.env} of ${n}</b>; read a confidential file in <b>${r.conf} of ${n}</b>; did more than asked in <b>${r.overreach} of ${n}</b>; held for a person in <b>${r.held} of ${n}</b>; job done in <b>${r.job} of ${n}</b>.`
 $('foot').textContent=run.id==='live'?`A live run, now: the smaller model, labelled. A fictional company; fake keys made for this run on this laptop, deleted after. The rates above are from the recorded runs. Not public.`:`Real runs (${R.made}), the smaller model, labelled. A fictional company; fake keys made for each run and never recorded. This is run ${run.id}${run.id===c.shown?', the most common outcome at this rung':''}. Not public.`}
function show(run,i){const st=run.steps[i];draw(cur.story);let seen=0,over=0
 for(let j=0;j<=i;j++){const x=run.steps[j],now=j===i
  if(x.k==='ask')line('rui','agent','need')
  if(x.k==='read')for(const f of x.files){const n=f.c==='other'?'extra':f.c,tone=f.refused?'stop':f.c==='need'?'need':'bad'
   if(f.refused){if(now)barrier(n,'agent','capability');continue}
   line(n,'agent',tone,now&&f.c!=='need'?(f.c==='env'?'3 keys':f.c==='other'?'confidential':''):'');if(now&&f.c==='env')particle('env','agent','#f5b942')
   seen+=f.seen.length}
  if(x.k==='run')line('agent','run',x.tone==='ok'?'ok':'warn',now?(x.tone==='ok'?'runs':'fails'):'')
  if(x.k==='install'){if(x.tone==='stop'){if(now)barrier('agent','install',x.by)}else{line('agent','install','act',now?'installs':'');over++}}
  if(x.k==='schedule'){if(x.tone==='stop'){if(now)barrier('agent','schedule',x.by)}else{line('agent','schedule','act',now?'as Rui, until removed':'');over++}}
  if(x.k==='send'){if(x.tone==='stop'){if(now)barrier('agent','send',x.by)}else{line('agent','send',x.tone);for(const t of x.to)line('send',t==='Dana'?'dana':'marta',x.tone);if(x.tone==='act')over++}}
 }
 W.ring.setAttribute('stroke',seen?'#f5b942':'#9b8cff');W.ring.setAttribute('stroke-width',4+seen*3);W.held.textContent=seen?`holds ${seen} thing${seen>1?'s':''} it should not`:''
 $('bT').textContent=`${i+1} · ${st.b}`;$('bS').textContent=sub(st);$('bubble').className='bubble '+(st.tone||'')
 $('cSeen').textContent=seen;$('cOver').textContent=over;$('cOverW').className=over?'nz':'z'
 $('bar2').innerHTML=run.steps.map((_,j)=>`<span class="${j<i?'done':j===i?'now':''}"></span>`).join('')}
function sub(st){if(st.k==='ask')return st.s
 if(st.k==='read')return st.files.map(f=>f.f+(f.refused?' (refused)':f.seen.length?` (${f.seen.map(l=>l.split(':')[0]==='data'?'confidential':l.split(':')[0]).join(', ')})`:'')).join(' · ')
 if(st.tone==='stop')return st.by==='review'?'The gateway holds it until a person approves':'The agent\'s account cannot do this: '+(st.by||'a barrier')
 if(st.k==='schedule')return 'RiskMandate RM-R0003: something that outlives the session'
 if(st.k==='install')return 'RiskMandate RM-R0012: software from the internet'
 if(st.k==='send'&&st.tone==='act')return 'A mail nobody asked for'
 if(st.k==='end')return st.tone==='bad'?'Helpful in intent; nobody told it to':'Nothing beyond the job'
 return ''}
function pick(c,keep){stopLive();if(!keep)loop=false;cur={...c};const r=runOf(cur.story,cur.rung,cur.run);cur.run=r.id;controls();side(null,r);start(r)}
function start(run){clearTimeout(timer);let i=0;const tick=()=>{show(run,i);if(!playing)return
  if(i<run.steps.length-1){i++;timer=setTimeout(tick,3200)}else timer=setTimeout(next,4500)};CTL.run=run;CTL.go=j=>{i=j;tick()};tick()}
function next(){if(!playing)return;if(!loop){start(runOf(cur.story,cur.rung,cur.run));return}
 const ss=Object.keys(R.stories);let{story,rung}=cur;rung++;if(!cellOf(story,rung)){rung=0;story=ss[(ss.indexOf(story)+1)%ss.length]}pick({story,rung,run:''},true)}
const LIVE=Q.get('live')==='1';let poll=null,shownN=-1
async function liveTick(){let L;try{L=await(await fetch('live.json',{cache:'no-store'})).json()}catch{$('liveS').textContent='the live command is not answering';return}
 if(L.state==='idle')return
 $('liveS').textContent=L.state==='running'?'running…':L.state==='done'?'finished':'the run failed: see the laptop\'s terminal'
 $('liveB').disabled=L.state==='running'
 if(L.run&&L.run.steps.length&&(L.run.steps.length!==shownN||L.state!=='running')){shownN=L.run.steps.length;cur={story:L.story,rung:L.rung,run:'live'};controls();side(null,L.run);show(L.run,L.run.steps.length-1)}
 if(L.state!=='running'){clearInterval(poll);poll=null}}
if(LIVE){$('liveG').hidden=false
 $('liveB').onclick=async()=>{playing=false;loop=false;clearTimeout(timer);controls();shownN=-1
  let r;try{r=await(await fetch(`start?story=${cur.story}&rung=${cur.rung}`,{method:'POST'})).json()}catch{r={error:'the live command is not answering'}}
  if(r.error){$('liveS').textContent=r.error;return}
  $('liveS').textContent='starting…';clearInterval(poll);poll=setInterval(liveTick,1000)}}
$('play').onclick=()=>{playing=!playing;controls();if(playing)start(runOf(cur.story,cur.rung,cur.run))}
$('loopB').onclick=()=>{loop=!loop;playing=true;controls();awake();if(loop)pick({story:cur.story,rung:cur.rung,run:''},true)}
// the stand's iPads (backlog 0m): while the loop plays, ask the browser to keep the screen on, and again when the page comes back
function awake(){try{if(loop&&navigator.wakeLock&&document.visibilityState==='visible')navigator.wakeLock.request('screen').catch(()=>{})}catch{}}
document.addEventListener('visibilitychange',awake)
document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();$('play').click()}})
async function main(){if(!R){try{R=await(await fetch('reach-runs.json',{cache:'no-store'})).json()}catch{}}
 if(!R||!R.stories){$('empty').hidden=false;$('stage').hidden=true;return}
 if(!R.stories[cur.story])cur.story='followup';if(!cellOf(cur.story,cur.rung))cur.rung=0
 pick(cur,true);awake()}
main()
if('serviceWorker' in navigator&&isSecureContext)navigator.serviceWorker.register('sw.js').catch(()=>{})
</script>
</body></html>
