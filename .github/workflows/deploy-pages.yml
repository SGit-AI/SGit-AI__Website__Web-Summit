# Deploys web-summit.sgit.ai to GitHub Pages, in the order the other SGit sites use:
# validate → tag → deploy, in two jobs (each job hop costs ~5 s of runner start-up, WS-65).
#
#   1. validate — builds (admin/build/build.mjs; generated output is never committed), then
#                 admin/build/validate.js: structure, links, version agreement, canonical host, agent
#                 block, signed articles, key-leak tripwire. On a push it uploads the very pages it
#                 checked as the Pages artifact, so what is deployed is what passed the gate (no
#                 second build). A failure stops everything: no tag, no publish. Also runs on PRs,
#                 read-only.
#   2. release  — tags via admin/build/tag_release.sh (push only):
#                   push to dev  -> the next minor (v0.1.N -> v0.1.N+1)
#                   push to main -> the next major (v0.N.M -> v0.N+1.0)
#                 The version comes from admin/build/version.txt and must also be in the release
#                 commit's subject ("site vX.Y.Z: ..."). Then deploys the artifact; a failed tag is
#                 no deploy.
name: deploy-pages
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # the agents-at-work page (wakes/) is built from the history; blobless keeps the clone small
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the site (generated output is never committed)
        run: node admin/build/build.mjs
      - name: Validate the site
        run: node admin/build/validate.js
      - name: Assemble the site artifact (the pages the gate just checked)
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/site
          rsync -a ./ /tmp/site/ --exclude '.git' --exclude '.github' --exclude '.sg_vault' --exclude 'content' --exclude 'admin/build' --exclude '.generated.txt'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: /tmp/site

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate]
    # Never from a PR. A manual dispatch deploys without tagging.
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - name: Tag this release
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  'GitHub Actions'
          git config user.email 'actions@github.com'
          admin/build/tag_release.sh
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
