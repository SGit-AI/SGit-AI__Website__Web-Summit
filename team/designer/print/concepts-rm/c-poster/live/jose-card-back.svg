<svg xmlns="http://www.w3.org/2000/svg" width="91mm" height="61mm" viewBox="0 0 91 61"><title>Jose Bota: RiskMandate business card, concept C. Poster, back. Trim 85 x 55 mm, 3 mm bleed (91 x 61 mm), live text</title><rect x="0" y="0" width="91" height="61" fill="#FFFFFF"/><rect x="0" y="0" width="91" height="40" fill="#e86a1c"/><text class="safe" data-role="line" data-bg="#e86a1c" x="8" y="18.47" font-family="Barlow Condensed" font-weight="800" font-size="10.93" fill="#FFFFFF">I brought 6 agents.</text><text class="safe" data-role="line" data-bg="#e86a1c" x="8" y="29.18" font-family="Barlow Condensed" font-weight="800" font-size="10.93" fill="#FFFFFF">Ask me why.</text><g id="rm-logo" class="safe" data-role="logo" data-cut="containered" data-d="8.5"><circle cx="12.25" cy="49" r="4.15" fill="none" stroke="#8C8C8A" stroke-width="0.2"/><text class="safe" data-role="placeholder" data-bg="#FFFFFF" x="9.19" y="49.71" font-family="Barlow Condensed" font-weight="600" font-size="2.03" fill="#8C8C8A">RM LOGO</text></g><text class="safe" data-role="wordmark" data-bg="#FFFFFF" x="20.75" y="50.5" font-family="Barlow Condensed" font-weight="300" font-size="4.29" fill="#161615">RISK</text><text class="safe" data-role="wordmark" data-bg="#FFFFFF" x="28.11" y="50.5" font-family="Barlow Condensed" font-weight="700" font-size="4.29" fill="#161615">MANDATE</text></svg>
