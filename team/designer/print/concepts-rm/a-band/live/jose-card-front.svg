<svg xmlns="http://www.w3.org/2000/svg" width="91mm" height="61mm" viewBox="0 0 91 61"><title>Jose Bota: RiskMandate business card, concept A. Band, front. Trim 85 x 55 mm, 3 mm bleed (91 x 61 mm), live text</title><rect x="0" y="0" width="91" height="61" fill="#FFFFFF"/><rect x="0" y="0" width="12" height="61" fill="#e86a1c"/><text class="safe" data-role="name" data-bg="#FFFFFF" x="18" y="16.5" font-family="Barlow Condensed" font-weight="700" font-size="6" fill="#161615">Jose Bota</text><text class="safe" data-role="role" data-bg="#FFFFFF" x="18" y="22" font-family="Barlow" font-weight="500" font-size="2.65" fill="#1A7F5A">Technical: automation, messaging, the agents</text><text class="safe" data-role="line" data-bg="#FFFFFF" x="18" y="30.5" font-family="Barlow Condensed" font-weight="600" font-size="3.53" fill="#161615">“I brought 6 agents. Ask me why.”</text><g id="rm-logo" class="safe" data-role="logo" data-cut="containered" data-d="11"><circle cx="23.5" cy="45" r="5.4" fill="none" stroke="#8C8C8A" stroke-width="0.2"/><text class="safe" data-role="placeholder" data-bg="#FFFFFF" x="19.54" y="45.92" font-family="Barlow Condensed" font-weight="600" font-size="2.63" fill="#8C8C8A">RM LOGO</text></g><text class="safe" data-role="wordmark" data-bg="#FFFFFF" x="34.5" y="46.8" font-family="Barlow Condensed" font-weight="300" font-size="5.14" fill="#161615">RISK</text><text class="safe" data-role="wordmark" data-bg="#FFFFFF" x="43.34" y="46.8" font-family="Barlow Condensed" font-weight="700" font-size="5.14" fill="#161615">MANDATE</text></svg>
