<svg xmlns="http://www.w3.org/2000/svg" width="91mm" height="61mm" viewBox="0 0 91 61"><title>Jose Bota: RiskMandate business card, round 2, 6. Signature, front. Trim 85 x 55 mm, 3 mm bleed (91 x 61 mm), live text</title><rect x="0" y="0" width="91" height="61" fill="#FFFFFF"/><text class="safe" data-role="name" data-bg="#FFFFFF" x="8" y="21" font-family="Barlow Condensed" font-weight="800" font-size="11.99" fill="#0D0D0C">Jose Bota</text><rect x="0" y="25" width="91" height="2.2" fill="#e86a1c"/><text class="safe" data-role="role" data-bg="#FFFFFF" x="8" y="33" font-family="Geist" font-weight="500" font-size="2.65" fill="#1A7F5A">Technical: automation, messaging, the agents</text><text class="safe" data-role="line" data-bg="#FFFFFF" x="8" y="39.2" font-family="Geist" font-weight="500" font-size="3.17" fill="#0D0D0C">I brought 6 agents. Ask me why.</text><text class="safe" data-role="event" data-bg="#FFFFFF" x="8" y="52" font-family="JetBrains Mono" font-weight="500" font-size="2.47" fill="#4A4845">FIND US AT OUR STAND ON THURSDAY 12 NOVEMBER</text></svg>
